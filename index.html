<title>Icon Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#131009;
    --surface:#1d1811;
    --surface-2:#26201a;
    --surface-3:#2f2721;
    --line:#3a2f20;
    --line-soft:#2a2318;
    --gold:#c7a257;
    --gold-bright:#e8c572;
    --verdigris:#5c8577;
    --oxide:#a34b3e;
    --text:#efe6d3;
    --text-dim:#b8a98a;
    --text-faint:#7a6f58;

    --c-science:#6e9c8f;
    --c-art:#c97b4a;
    --c-music:#b25d6b;
    --c-leaders:#c7a257;
    --c-thinkers:#7c8a99;
    --c-explorers:#4e88a2;
    --c-sports:#7fa35c;
    --c-icons:#9b7fa8;
    --c-elements:#7a6f58;

    --shadow-lift: 0 10px 30px -12px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'Archivo',ui-sans-serif,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  ::selection{background:var(--gold); color:var(--ink);}
  h1,h2,h3,h4,.display{ font-family:'Fraunces',Georgia,'Noto Serif KR',serif; text-wrap:balance; }
  .mono{ font-family:'Space Mono',ui-monospace,monospace; }
  button{ font-family:inherit; }

  .app{
    position:relative;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(199,162,87,.06), transparent 60%),
      radial-gradient(900px 500px at 100% 110%, rgba(92,133,119,.07), transparent 60%),
      var(--ink);
  }

  header.top{
    display:flex;
    align-items:center;
    gap:16px;
    padding:14px 22px;
    border-bottom:1px solid var(--line-soft);
    background:linear-gradient(180deg, rgba(29,24,17,.9), rgba(29,24,17,.55));
    backdrop-filter:blur(6px);
    flex-shrink:0;
    z-index:20;
  }
  .wordmark{ display:flex; align-items:baseline; gap:8px; white-space:nowrap; }
  .wordmark .mark{ font-size:20px; font-weight:700; letter-spacing:.02em; }
  .wordmark .mark em{ font-style:italic; color:var(--gold-bright); }
  .wordmark .tag{ display:none; color:var(--text-faint); font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  @media (min-width:1000px){ .wordmark .tag{ display:inline; } }

  .progress-wrap{ display:flex; align-items:center; gap:10px; margin-left:2px; flex-shrink:0; }
  .progress-count{ font-size:12px; letter-spacing:.04em; color:var(--text-dim); white-space:nowrap; }
  .progress-count b{ color:var(--gold-bright); font-weight:700; }
  .progress-track{ width:70px; height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden; display:none; }
  @media (min-width:760px){ .progress-track{ display:block; } }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--verdigris), var(--gold)); border-radius:3px; transition:width .4s ease; }

  .hof-btn{
    display:flex; align-items:center; gap:7px;
    border:1px solid var(--c-icons);
    background:linear-gradient(180deg, rgba(155,127,168,.16), rgba(155,127,168,.05));
    color:var(--text);
    padding:7px 12px;
    border-radius:999px;
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }
  .hof-btn:hover{ border-color:var(--gold-bright); }
  .hof-btn b{ color:var(--gold-bright); }

  .search-wrap{ flex:1; max-width:280px; position:relative; }
  .search-wrap input{ width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 12px 9px 32px; font-size:13px; outline:none; }
  .search-wrap input::placeholder{ color:var(--text-faint); }
  .search-wrap input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(199,162,87,.15); }
  .search-wrap svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.5; pointer-events:none; }

  .top-actions{ display:flex; gap:8px; margin-left:auto; flex-shrink:0; }
  .btn{ border:1px solid var(--line); background:var(--surface); color:var(--text-dim); padding:8px 12px; border-radius:8px; font-size:12.5px; letter-spacing:.01em; cursor:pointer; display:flex; align-items:center; gap:6px; transition:border-color .15s, color .15s; }
  .btn:hover{ border-color:var(--gold); color:var(--text); }
  .btn:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:2px; }
  .btn svg{ width:14px; height:14px; }
  .btn-icon-only span{ display:none; }
  @media (min-width:560px){ .btn-icon-only span{ display:inline; } }

  .layout{ flex:1; display:flex; min-height:0; position:relative; }

  .ledger{
    width:300px; flex-shrink:0;
    border-right:1px solid var(--line-soft);
    background:rgba(24,20,14,.6);
    display:flex; flex-direction:column; min-height:0;
    transition:box-shadow .2s;
  }
  .ledger.delete-hover{ box-shadow:inset 0 0 0 2px var(--oxide); background:rgba(70,24,18,.35); }
  .ledger-drop-hint{
    display:none; align-items:center; justify-content:center; gap:6px;
    padding:8px; margin:0 12px 8px; border:1px dashed var(--oxide); border-radius:8px;
    color:var(--oxide); font-size:11.5px; flex-shrink:0;
  }
  .ledger.delete-hover .ledger-drop-hint{ display:flex; }
  .ledger-tabs{ display:flex; gap:6px; padding:12px 12px 0; overflow-x:auto; scrollbar-width:none; flex-shrink:0; }
  .ledger-tabs::-webkit-scrollbar{ display:none; }
  .tab{ flex-shrink:0; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--text-faint); background:transparent; border:1px solid var(--line); padding:6px 10px; border-radius:999px; cursor:pointer; white-space:nowrap; }
  .tab[data-active="true"]{ color:var(--ink); background:var(--tab-color, var(--gold)); border-color:transparent; font-weight:700; }

  .ledger-scroll{ flex:1; overflow-y:auto; padding:10px 12px 30px; }
  .ledger-group{ margin-bottom:18px; }
  .ledger-group h3{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); font-weight:600; margin:0 0 8px 2px; display:flex; align-items:center; gap:6px; }
  .ledger-group h3 .dot{ width:6px; height:6px; border-radius:50%; background:var(--grp-color, var(--gold)); display:inline-block; }
  .ledger-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(76px,1fr)); gap:8px; }

  .medallion{ all:unset; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:5px; padding:9px 4px 8px; border-radius:12px; cursor:grab; user-select:none; touch-action:none; text-align:center; }
  .medallion:hover{ background:var(--surface-2); }
  .medallion:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:2px; }
  .coin{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; background:radial-gradient(circle at 32% 28%, var(--surface-3), var(--surface)); border:1.5px solid var(--line); box-shadow: inset 0 0 0 3px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04); position:relative; }
  .medallion.discovered .coin{ border-color:var(--coin-color, var(--gold)); box-shadow: inset 0 0 0 3px rgba(0,0,0,.3), 0 0 0 1px rgba(199,162,87,.15); }
  .medallion.discovered.legendary .coin{ box-shadow: inset 0 0 0 3px rgba(0,0,0,.25), 0 0 12px 1px rgba(232,197,114,.5); animation:shimmer 3s ease-in-out infinite; }
  .medallion.locked .coin{ color:var(--text-faint); font-family:'Fraunces',serif; font-style:italic; opacity:.5; border-style:dashed; }
  .medallion.locked.person-slot .coin{ opacity:.4; font-style:normal; }
  .medallion .lbl{ font-size:10.5px; line-height:1.15; color:var(--text-dim); max-width:74px; }
  .medallion.locked .lbl{ color:var(--text-faint); }
  .medallion.discovered .lbl{ color:var(--text); }

  @keyframes shimmer{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.35); } }

  .empty-note{ color:var(--text-faint); font-size:12px; padding:20px 8px; text-align:center; line-height:1.6; }

  .workbench{ flex:1; position:relative; min-width:0; overflow:hidden; }
  .workbench-surface{ position:absolute; inset:0; background: radial-gradient(circle at 50% 45%, rgba(199,162,87,.05), transparent 45%), var(--ink); overflow:hidden; }
  .workbench-surface svg.etch{ position:absolute; inset:0; width:100%; height:100%; opacity:.35; }

  .wb-empty{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; padding:20px; }
  .wb-empty-inner{ text-align:center; max-width:360px; color:var(--text-faint); }
  .wb-empty-inner .coin{ width:56px;height:56px;font-size:26px;margin:0 auto 14px; }
  .wb-empty-inner h2{ font-size:19px; color:var(--text-dim); margin:0 0 8px; font-weight:600; }
  .wb-empty-inner p{ font-size:12.5px; line-height:1.6; margin:0; }
  .wb-empty-inner p b{ color:var(--gold-bright); font-weight:600; }

  .token{ position:absolute; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:grab; touch-action:none; user-select:none; transform:translate(-50%,-50%); }
  .token .coin{ width:58px; height:58px; font-size:26px; box-shadow: inset 0 0 0 3px rgba(0,0,0,.3), var(--shadow-lift); border-width:2px; border-color:var(--coin-color, var(--gold)); }
  .token .lbl{ font-size:11px; background:rgba(19,16,9,.85); padding:2px 7px; border-radius:999px; color:var(--text); white-space:nowrap; border:1px solid var(--line-soft); }
  .token.lifted{ filter:drop-shadow(0 14px 20px rgba(0,0,0,.5)); }
  .token.person .coin{ background:radial-gradient(circle at 32% 28%, #2f271b, #1d1811); }
  .token.miss .coin{ animation:shake .32s ease; }
  .token.mint .coin{ animation:mint .7s cubic-bezier(.2,.9,.3,1); }
  .token.mint-ring::after{ content:""; position:absolute; inset:-8px; border-radius:50%; border:2px solid var(--gold-bright); animation:ring .7s ease-out forwards; }
  .token.delete-target .coin{ opacity:.4; filter:grayscale(1); }

  @keyframes shake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-4px); } 75%{ transform:translateX(4px); } }
  @keyframes mint{ 0%{ transform:scale(.6); filter:brightness(2.2); } 55%{ transform:scale(1.12); filter:brightness(1.5); } 100%{ transform:scale(1); filter:brightness(1); } }
  @keyframes ring{ 0%{ opacity:1; transform:scale(.6); } 100%{ opacity:0; transform:scale(2.4); } }

  .drag-ghost{ position:fixed; z-index:999; pointer-events:none; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:4px; }
  .drag-ghost .coin{ width:56px; height:56px; font-size:25px; box-shadow: 0 16px 30px -8px rgba(0,0,0,.7); border-width:2px; }
  .drag-ghost .lbl{ font-size:11px; background:rgba(19,16,9,.9); padding:2px 8px; border-radius:999px; color:var(--text); border:1px solid var(--line-soft); }

  .wb-toolbar{ position:absolute; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:15; }

  #toastLayer{ position:fixed; top:70px; right:18px; display:flex; flex-direction:column; gap:8px; z-index:200; pointer-events:none; }
  .toast{ background:linear-gradient(180deg, var(--surface-2), var(--surface)); border:1px solid var(--gold); border-radius:10px; padding:10px 14px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow-lift); min-width:220px; max-width:280px; animation:toastIn .35s ease; }
  .toast .coin{ width:34px;height:34px;font-size:16px;flex-shrink:0; }
  .toast .tt-title{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold-bright); margin:0 0 2px; display:flex; gap:6px; align-items:center; }
  .toast .tt-name{ font-size:13px; font-weight:600; color:var(--text); }
  .toast .streak{ font-size:9.5px; color:var(--oxide); font-weight:700; background:rgba(163,75,62,.15); padding:1px 6px; border-radius:999px; }
  @keyframes toastIn{ from{ opacity:0; transform:translateX(14px); } to{ opacity:1; transform:translateX(0); } }
  .toast.leaving{ animation:toastOut .3s ease forwards; }
  @keyframes toastOut{ to{ opacity:0; transform:translateX(14px); } }

  /* ---------- reveal modal (person discovery) ---------- */
  .overlay-backdrop{ position:fixed; inset:0; background:rgba(10,8,5,.72); backdrop-filter:blur(3px); z-index:400; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

  .reveal-card{ position:relative; width:min(380px,100%); background:linear-gradient(180deg, var(--surface-2), var(--surface)); border:1px solid var(--gold); border-radius:18px; padding:34px 26px 26px; text-align:center; box-shadow:0 30px 80px -20px rgba(0,0,0,.7); overflow:hidden; animation:cardIn .45s cubic-bezier(.2,.9,.25,1); }
  @keyframes cardIn{ from{ transform:scale(.85) translateY(10px); opacity:0; } to{ transform:scale(1) translateY(0); opacity:1; } }
  .reveal-card .burst{ position:absolute; inset:-40%; background:conic-gradient(from 0deg, transparent, rgba(232,197,114,.18), transparent 30%); animation:spin 6s linear infinite; pointer-events:none; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .reveal-card .rc-inner{ position:relative; }
  .reveal-card .rc-eyebrow{ font-size:10.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--gold-bright); margin-bottom:14px; }
  .reveal-card .rc-eyebrow.legendary{ color:#f0d391; }
  .reveal-coin{ width:100px; height:100px; border-radius:50%; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; font-size:46px; background:radial-gradient(circle at 32% 28%, #362c1e, #1d1811); border:3px solid var(--coin-color,var(--gold)); box-shadow:0 0 0 6px rgba(199,162,87,.12), 0 0 30px rgba(232,197,114,.35); position:relative; animation:revealPop .6s cubic-bezier(.2,.9,.25,1); }
  @keyframes revealPop{ 0%{ transform:scale(.4) rotate(-8deg); } 60%{ transform:scale(1.08) rotate(3deg); } 100%{ transform:scale(1) rotate(0); } }
  .reveal-coin::after{ content:""; position:absolute; inset:-10px; border-radius:50%; border:1.5px solid var(--coin-color,var(--gold)); opacity:.6; animation:ring 1.1s ease-out .1s; }
  .reveal-card h3{ font-size:26px; margin:0 0 6px; }
  .reveal-badges{ display:flex; gap:6px; justify-content:center; margin-bottom:16px; flex-wrap:wrap; }
  .badge{ font-size:10px; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--text-dim); }
  .badge.cat{ border-color:var(--coin-color,var(--gold)); color:var(--coin-color,var(--gold)); }
  .badge.era-living{ border-color:var(--verdigris); color:var(--verdigris); }
  .badge.rarity-legendary{ border-color:#f0d391; color:#f0d391; }
  .reveal-quote{ font-family:'Fraunces',serif; font-style:italic; font-size:16px; line-height:1.5; color:var(--text); margin:0 0 22px; text-wrap:balance; }
  .reveal-quote::before,.reveal-quote::after{ content:'"'; color:var(--gold); }
  .reveal-blurb{ font-size:12px; color:var(--text-dim); line-height:1.5; margin:-14px 0 20px; }
  .reveal-close{ background:linear-gradient(180deg, var(--gold-bright), var(--gold)); color:#241c0f; border:none; padding:10px 24px; border-radius:999px; font-weight:700; font-size:13px; cursor:pointer; }
  .reveal-close:hover{ filter:brightness(1.06); }

  /* ---------- hall of fame ---------- */
  .hof-backdrop{ position:fixed; inset:0; background:rgba(10,8,5,.8); z-index:350; display:flex; justify-content:center; padding:40px 16px; overflow-y:auto; animation:fadeIn .2s ease; }
  .hof-panel{ width:min(920px,100%); background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:26px 22px 34px; height:fit-content; box-shadow:var(--shadow-lift); }
  .hof-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .hof-head h2{ font-size:24px; margin:0; }
  .hof-head p{ margin:2px 0 0; color:var(--text-faint); font-size:12px; }
  .hof-close{ background:transparent; border:1px solid var(--line); color:var(--text-dim); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:16px; line-height:1; }
  .hof-close:hover{ border-color:var(--gold); color:var(--text); }
  .hof-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px; }
  .hof-card{ border:1px solid var(--line); border-radius:12px; padding:14px 10px; text-align:center; background:var(--surface-2); }
  .hof-card .coin{ width:52px;height:52px;font-size:24px;margin:0 auto 8px; }
  .hof-card.locked{ opacity:.55; }
  .hof-card .hc-name{ font-size:12.5px; font-weight:600; margin-bottom:3px; }
  .hof-card .hc-cat{ font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--coin-color,var(--text-faint)); margin-bottom:6px; }
  .hof-card .hc-quote{ font-family:'Fraunces',serif; font-style:italic; font-size:10.5px; color:var(--text-dim); line-height:1.4; }
  .hof-card.locked .hc-name{ color:var(--text-faint); }

  .ledger-toggle{ display:none; }
  @media (max-width:820px){
    .ledger{ position:fixed; left:0; right:0; bottom:0; top:auto; height:52%; width:auto; border-right:none; border-top:1px solid var(--line-soft); border-radius:16px 16px 0 0; transform:translateY(calc(100% - 54px)); transition:transform .28s cubic-bezier(.2,.8,.3,1); z-index:60; box-shadow:0 -20px 40px rgba(0,0,0,.5); }
    .ledger.open{ transform:translateY(0); }
    .ledger-toggle{ display:flex; align-items:center; justify-content:center; gap:8px; height:54px; flex-shrink:0; color:var(--text-dim); font-size:12.5px; cursor:pointer; border-bottom:1px solid var(--line-soft); }
    .ledger-toggle .chev{ transition:transform .28s; }
    .ledger.open .ledger-toggle .chev{ transform:rotate(180deg); }
    .wordmark .tag{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001s !important; transition-duration:.001s !important; } }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="wordmark">
      <span class="mark">ICON <em>LAB</em></span>
      <span class="tag">Combine history's icons</span>
    </div>
    <div class="progress-wrap">
      <span class="progress-count mono">"<b id="discCount">0</b>/<span id="totalCount">0</span> forged"</span>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <button class="hof-btn" id="hofBtn" title="Open Hall of Fame">
      🏛 <b id="personCount">0</b>/<span id="personTotal">0</span> Icons
    </button>
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="Search…" autocomplete="off" />
    </div>
    <div class="top-actions">
      <button class="btn btn-icon-only" id="shareBtn" title="Share your progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5 15.4 17.5M15.4 6.5 8.6 10.5"/></svg>
        <span>Share</span>
      </button>
      <button class="btn btn-icon-only" id="resetBtn" title="Reset progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        <span>Reset</span>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="ledger" id="ledger">
      <div class="ledger-toggle" id="ledgerToggle">
        <span>Codex</span>
        <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m18 15-6-6-6 6"/></svg>
      </div>
      <div class="ledger-drop-hint">🗑 Drop here to remove</div>
      <div class="ledger-tabs" id="ledgerTabs"></div>
      <div class="ledger-scroll" id="ledgerScroll"></div>
    </aside>

    <main class="workbench">
      <div class="workbench-surface" id="surface">
        <svg class="etch" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">
          <circle cx="200" cy="200" r="150" fill="none" stroke="#c7a257" stroke-width="0.6"/>
          <circle cx="200" cy="200" r="110" fill="none" stroke="#c7a257" stroke-width="0.4"/>
          <circle cx="200" cy="200" r="188" fill="none" stroke="#c7a257" stroke-width="0.3"/>
          <g stroke="#c7a257" stroke-width="0.3">
            <line x1="200" y1="12" x2="200" y2="388"/>
            <line x1="12" y1="200" x2="388" y2="200"/>
            <line x1="53" y1="53" x2="347" y2="347"/>
            <line x1="347" y1="53" x2="53" y2="347"/>
          </g>
        </svg>
        <div class="wb-empty" id="wbEmpty">
          <div class="wb-empty-inner">
            <div class="coin">🔥</div>

const ELEMENTS = RAW.map(row=>{
  const [id,name,emoji,r,cat,flavor,era,quote] = row;
  return {id,name,emoji,r,cat,flavor,era:era||null,person:!!era,quote:quote||null};
});
const BY_ID = new Map(ELEMENTS.map(e=>[e.id,e]));
const CAT_BY_ID = new Map(CATS.map(c=>[c.id,c]));

const RECIPES = new Map();
const dupWarnings = [];
ELEMENTS.forEach(e=>{
  if(!e.r) return;
  const key = [e.r[0],e.r[1]].sort().join("|");
  if(RECIPES.has(key) && RECIPES.get(key)!==e.id) dupWarnings.push(`Dup ${key}: ${RECIPES.get(key)} vs ${e.id}`);
  RECIPES.set(key,e.id);
});
if(dupWarnings.length) console.warn("Icon Lab recipe collisions:\n"+dupWarnings.join("\n"));

const BASE_IDS = ["fire","water","earth","air"];
const DEPTH = new Map(BASE_IDS.map(id=>[id,0]));
(function computeDepth(){
  let changed = true;
  while(changed){
    changed = false;
    ELEMENTS.forEach(e=>{
      if(DEPTH.has(e.id) || !e.r) return;
      const d0=DEPTH.get(e.r[0]), d1=DEPTH.get(e.r[1]);
      if(d0!==undefined && d1!==undefined){ DEPTH.set(e.id, Math.max(d0,d1)+1); changed=true; }
    });
  }
  const unreached = ELEMENTS.filter(e=>!DEPTH.has(e.id)).map(e=>e.id);
  if(unreached.length) console.warn("Icon Lab: unreachable ->", unreached);
})();
function rarityOf(e){ if(!e.person) return null; return DEPTH.get(e.id)<=3 ? "notable" : "legendary"; }

const PERSONS = ELEMENTS.filter(e=>e.person);
const TOTAL = ELEMENTS.length;
document.getElementById("totalCount").textContent = TOTAL;
document.getElementById("personTotal").textContent = PERSONS.length;

const LS_KEY = "iconlab.discovered.v2";
let discovered = new Set(BASE_IDS);
try{
  const saved = JSON.parse(localStorage.getItem(LS_KEY) || "null");
  if(Array.isArray(saved) && saved.length) discovered = new Set(saved.filter(id=>BY_ID.has(id)));
}catch(e){}
function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...discovered])); }catch(e){} }

let activeCat = "all";
let searchTerm = "";
let lastDiscoverAt = 0;
let streak = 0;

const ledgerTabsEl = document.getElementById("ledgerTabs");
const ledgerScrollEl = document.getElementById("ledgerScroll");
const surfaceEl = document.getElementById("surface");
const wbEmptyEl = document.getElementById("wbEmpty");
const discCountEl = document.getElementById("discCount");
const personCountEl = document.getElementById("personCount");
const progressFillEl = document.getElementById("progressFill");
const toastLayer = document.getElementById("toastLayer");
const modalLayer = document.getElementById("modalLayer");
const ledgerEl = document.getElementById("ledger");
const ledgerToggle = document.getElementById("ledgerToggle");

function buildTabs(){
  const tabs = [{id:"all",label:"All",color:"var(--gold)"}, ...CATS];
  ledgerTabsEl.innerHTML = "";
  tabs.forEach(t=>{
    const b = document.createElement("button");
    b.className = "tab";
    b.textContent = t.label;
    b.style.setProperty("--tab-color", t.color);
    b.dataset.active = String(t.id===activeCat);
    b.addEventListener("click", ()=>{ activeCat = t.id; renderLedger(); buildTabs(); });
    ledgerTabsEl.appendChild(b);
  });
}

function renderLedger(){
  const q = searchTerm.trim().toLowerCase();
  const groups = activeCat==="all" ? CATS : CATS.filter(c=>c.id===activeCat);
  ledgerScrollEl.innerHTML = "";
  let any = false;

  groups.forEach(cat=>{
    let items = ELEMENTS.filter(e=>e.cat===cat.id);
    if(q) items = items.filter(e=> discovered.has(e.id) && e.name.toLowerCase().includes(q) );
    if(!items.length) return;
    any = true;
    const g = document.createElement("div");
    g.className = "ledger-group";
    const h = document.createElement("h3");
    h.style.setProperty("--grp-color", cat.color);
    h.innerHTML = `<span class="dot"></span>${cat.label} <span class="mono" style="font-weight:400;color:var(--text-faint)">(${items.filter(i=>discovered.has(i.id)).length}/${items.length})</span>`;
    g.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "ledger-grid";
    items.forEach(e=> grid.appendChild(makeMedallion(e)) );
    g.appendChild(grid);
    ledgerScrollEl.appendChild(g);
  });

  if(!any){
    const p = document.createElement("div");
    p.className = "empty-note";
    p.textContent = q ? "No discovered icons match your search." : "Nothing here yet — go combine something.";
    ledgerScrollEl.appendChild(p);
  }

  discCountEl.textContent = discovered.size;
  progressFillEl.style.width = Math.round((discovered.size/TOTAL)*100) + "%";
  personCountEl.textContent = PERSONS.filter(p=>discovered.has(p.id)).length;
}

function makeMedallion(e){
  const isKnown = discovered.has(e.id);
  const rarity = rarityOf(e);
  const el = document.createElement("button");
  el.className = "medallion " + (isKnown ? "discovered" : "locked") + (e.person?" person-slot":"") + (rarity==="legendary"&&isKnown?" legendary":"");
  el.dataset.id = e.id;
  const cat = CAT_BY_ID.get(e.cat);
  const lockedGlyph = e.person ? "👤" : "?";
  el.innerHTML = `
    <span class="coin" style="--coin-color:${cat.color}">${isKnown ? e.emoji : lockedGlyph}</span>
    <span class="lbl">${isKnown ? e.name : "???"}</span>
  `;
  if(isKnown){
    el.addEventListener("pointerdown", (ev)=> startSidebarDrag(ev, e.id));
    el.title = e.name;
  }else{
    el.addEventListener("click", ()=> toast({locked:true, text:"Not discovered yet — try combining related elements."}) );
  }
  return el;
}

/* =========================================================
   TOASTS (regular elements)
========================================================= */
function toast({id, locked, text}){
  const div = document.createElement("div");
  div.className = "toast";
  if(locked){
    div.innerHTML = `<span class="coin" style="--coin-color:var(--text-faint)">?</span>
      <div><div class="tt-title">Codex</div><div class="tt-name" style="font-weight:500;font-size:12px;color:var(--text-dim)">${text}</div></div>`;
  }else{
    const e = BY_ID.get(id);
    const cat = CAT_BY_ID.get(e.cat);
    const showStreak = streak>=2 ? `<span class="streak">🔥 ${streak} in a row</span>` : "";
    div.innerHTML = `<span class="coin" style="--coin-color:${cat.color}">${e.emoji}</span>
      <div><div class="tt-title">New Discovery ${showStreak}</div><div class="tt-name">${e.name}</div></div>`;
  }
  toastLayer.appendChild(div);
  setTimeout(()=>{ div.classList.add("leaving"); setTimeout(()=>div.remove(), 320); }, 2600);
}

/* =========================================================
   REVEAL MODAL (person discovery)
========================================================= */
function showReveal(id){
  const e = BY_ID.get(id);
  const cat = CAT_BY_ID.get(e.cat);
  const rarity = rarityOf(e);
  const backdrop = document.createElement("div");
  backdrop.className = "overlay-backdrop";
  backdrop.innerHTML = `
    <div class="reveal-card" style="--coin-color:${cat.color}">
      <div class="burst"></div>
      <div class="rc-inner">
        <div class="rc-eyebrow ${rarity==='legendary'?'legendary':''}">${rarity==='legendary' ? '★ Legendary Icon Forged ★' : 'New Icon Forged'}</div>
        <div class="reveal-coin">${e.emoji}</div>
        <h3>${e.name}</h3>
        <div class="reveal-badges">
          <span class="badge cat">${cat.label}</span>
          ${e.era==='living' ? '<span class="badge era-living">Living</span>' : '<span class="badge">Historical</span>'}
          ${rarity==='legendary' ? '<span class="badge rarity-legendary">Legendary</span>' : ''}
        </div>
        <p class="reveal-quote">${e.quote}</p>
        <p class="reveal-blurb">${e.flavor}</p>
        <button class="reveal-close">Continue</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  function close(){ backdrop.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(ev){ if(ev.key==="Escape") close(); }
  backdrop.addEventListener("click", (ev)=>{ if(ev.target===backdrop) close(); });
  backdrop.querySelector(".reveal-close").addEventListener("click", close);
  document.addEventListener("keydown", onKey);
}

/* =========================================================
   HALL OF FAME
========================================================= */
function openHallOfFame(){
  const backdrop = document.createElement("div");
  backdrop.className = "hof-backdrop";
  const found = PERSONS.filter(p=>discovered.has(p.id)).length;
  const cards = PERSONS.map(p=>{
    const known = discovered.has(p.id);
    const cat = CAT_BY_ID.get(p.cat);
    if(!known){
      return `<div class="hof-card locked"><span class="coin" style="--coin-color:${cat.color}">👤</span><div class="hc-name">???</div><div class="hc-cat" style="--coin-color:${cat.color}">${cat.label}</div></div>`;
    }
    return `<div class="hof-card" style="--coin-color:${cat.color}">
      <span class="coin" style="--coin-color:${cat.color}">${p.emoji}</span>
      <div class="hc-name">${p.name}</div>
      <div class="hc-cat" style="--coin-color:${cat.color}">${cat.label} · ${rarityOf(p)==='legendary'?'Legendary':'Notable'}</div>
      <div class="hc-quote">"${p.quote}"</div>
    </div>`;
  }).join("");
  backdrop.innerHTML = `
    <div class="hof-panel">
      <div class="hof-head">
        <div>
          <h2>Hall of Fame</h2>
          <p>${found} of ${PERSONS.length} icons forged</p>
        </div>
        <button class="hof-close" id="hofClose">&times;</button>
      </div>
      <div class="hof-grid">${cards}</div>
    </div>
  `;
  document.body.appendChild(backdrop);
  function close(){ backdrop.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(ev){ if(ev.key==="Escape") close(); }
  backdrop.addEventListener("click",(ev)=>{ if(ev.target===backdrop) close(); });
  backdrop.querySelector("#hofClose").addEventListener("click", close);
  document.addEventListener("keydown", onKey);
}
document.getElementById("hofBtn").addEventListener("click", openHallOfFame);

/* =========================================================
   WORKBENCH TOKENS + DRAG ENGINE
========================================================= */
let tokenSeq = 0;
let zCounter = 1;
const tokens = new Map();

function updateEmptyState(){ wbEmptyEl.style.display = tokens.size ? "none" : "flex"; }

function placeToken(elemId, x, y){
  const key = "tk"+(tokenSeq++);
  const e = BY_ID.get(elemId);
  const cat = CAT_BY_ID.get(e.cat);
  const el = document.createElement("div");
  el.className = "token" + (e.person ? " person" : "");
  el.style.setProperty("--coin-color", cat.color);
  el.style.left = x+"px";
  el.style.top = y+"px";
  el.style.zIndex = String(++zCounter);
  el.innerHTML = `<span class="coin">${e.emoji}</span><span class="lbl">${e.name}</span>`;
  el.addEventListener("pointerdown",(ev)=> startTokenDrag(ev,key));
  surfaceEl.appendChild(el);
  tokens.set(key,{id:elemId,x,y,el});
  updateEmptyState();
  return key;
}

function removeToken(key){
  const t = tokens.get(key);
  if(!t) return;
  t.el.remove();
  tokens.delete(key);
  updateEmptyState();
}

function nearestOverlap(key,x,y){
  let best=null, bestD=Infinity;
  tokens.forEach((t,k)=>{
    if(k===key) return;
    const d = Math.hypot(t.x-x, t.y-y);
    if(d<54 && d<bestD){ bestD=d; best=k; }
  });
  return best;
}

function surfacePoint(clientX, clientY){
  const r = surfaceEl.getBoundingClientRect();
  return {
    x: Math.min(Math.max(clientX-r.left, 30), r.width-30),
    y: Math.min(Math.max(clientY-r.top, 30), r.height-30)
  };
}

function isPointOverLedger(clientX, clientY){
  const r = ledgerEl.getBoundingClientRect();
  return clientX>=r.left && clientX<=r.right && clientY>=r.top && clientY<=r.bottom;
}

/* ---- drag from sidebar (spawns new token) ---- */
function startSidebarDrag(ev, elemId){
  ev.preventDefault();
  const startX = ev.clientX, startY = ev.clientY;
  let ghost=null, dragging=false;

  function makeGhost(){
    const e = BY_ID.get(elemId);
    const cat = CAT_BY_ID.get(e.cat);
    ghost = document.createElement("div");
    ghost.className = "drag-ghost";
    ghost.style.setProperty("--coin-color", cat.color);
    ghost.innerHTML = `<span class="coin">${e.emoji}</span><span class="lbl">${e.name}</span>`;
    document.body.appendChild(ghost);
    moveGhost(startX,startY);
  }
  function moveGhost(x,y){ if(ghost){ ghost.style.left=x+"px"; ghost.style.top=y+"px"; } }

  function onMove(mv){
    const dx = mv.clientX-startX, dy = mv.clientY-startY;
    if(!dragging && Math.hypot(dx,dy)>6){ dragging=true; makeGhost(); }
    if(dragging) moveGhost(mv.clientX, mv.clientY);
  }
  function onUp(up){
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    if(ghost) ghost.remove();

    const rect = surfaceEl.getBoundingClientRect();
    const inSurface = up.clientX>=rect.left && up.clientX<=rect.right && up.clientY>=rect.top && up.clientY<=rect.bottom;
    if(!dragging){
      const cx = rect.width/2 + (Math.random()*80-40);
      const cy = rect.height/2 + (Math.random()*80-40);
      dropNewToken(elemId, cx, cy);
      return;
    }
    if(inSurface){
      const p = surfacePoint(up.clientX, up.clientY);
      dropNewToken(elemId, p.x, p.y);
    }
  }
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
}

function dropNewToken(elemId, x, y){
  const key = placeToken(elemId, x, y);
  const overlap = nearestOverlap(key, x, y);
  if(overlap) attemptCombine(key, overlap);
}

/* ---- drag existing token: move / combine / delete-on-ledger ---- */
function startTokenDrag(ev, key){
  ev.preventDefault();
  ev.stopPropagation();
  const t = tokens.get(key);
  if(!t) return;
  const startClientX = ev.clientX, startClientY = ev.clientY;
  const startX = t.x, startY = t.y;
  t.el.classList.add("lifted");
  t.el.style.zIndex = String(++zCounter);

  function onMove(mv){
    const dx = mv.clientX-startClientX, dy = mv.clientY-startClientY;
    const rect = surfaceEl.getBoundingClientRect();
    const nx = Math.min(Math.max(startX+dx, 30), rect.width-30);
    const ny = Math.min(Math.max(startY+dy, 30), rect.height-30);
    t.x=nx; t.y=ny;
    t.el.style.left=nx+"px"; t.el.style.top=ny+"px";

    const overLedger = isPointOverLedger(mv.clientX, mv.clientY);
    ledgerEl.classList.toggle("delete-hover", overLedger);
    t.el.classList.toggle("delete-target", overLedger);
  }
  function onUp(up){
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    t.el.classList.remove("lifted","delete-target");
    ledgerEl.classList.remove("delete-hover");

    if(isPointOverLedger(up.clientX, up.clientY)){
      removeToken(key);
      return;
    }
    const overlap = nearestOverlap(key, t.x, t.y);
    if(overlap) attemptCombine(key, overlap);
  }
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
}

function attemptCombine(keyA, keyB){
  const a = tokens.get(keyA), b = tokens.get(keyB);
  if(!a || !b) return;
  const recipeKey = [a.id,b.id].sort().join("|");
  const resultId = RECIPES.get(recipeKey);

  if(!resultId){
    [a.el,b.el].forEach(el=>{ el.classList.add("miss"); setTimeout(()=>el.classList.remove("miss"), 350); });
    return;
  }

  const midX = (a.x+b.x)/2, midY = (a.y+b.y)/2;
  removeToken(keyA);
  removeToken(keyB);
  const isNew = !discovered.has(resultId);
  const newKey = placeToken(resultId, midX, midY);
  const t = tokens.get(newKey);
  t.el.classList.add("mint");
  if(isNew) t.el.classList.add("mint-ring");
  setTimeout(()=>t.el.classList.remove("mint","mint-ring"), 720);

  if(isNew){
    const now = Date.now();
    streak = (now-lastDiscoverAt < 4000) ? streak+1 : 1;
    lastDiscoverAt = now;

    discovered.add(resultId);
    persist();
    renderLedger();

    const result = BY_ID.get(resultId);
    if(result.person) showReveal(resultId);
    else toast({id:resultId});
  }
}

/* =========================================================
   TOOLBAR
========================================================= */
document.getElementById("clearBtn").addEventListener("click", ()=>{ [...tokens.keys()].forEach(removeToken); });

document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(!confirm("Reset all progress? This clears every icon you've discovered.")) return;
  discovered = new Set(BASE_IDS);
  persist();
  [...tokens.keys()].forEach(removeToken);
  renderLedger();
});

document.getElementById("shareBtn").addEventListener("click", async ()=>{
  const people = PERSONS.filter(p=>discovered.has(p.id)).length;
  const text = `I've forged ${discovered.size}/${TOTAL} elements on Icon Lab (${people}/${PERSONS.length} historical icons unlocked). Can you beat me?`;
  try{ await navigator.clipboard.writeText(text); toast({locked:true, text:"Copied your progress to clipboard!"}); }
  catch(e){ toast({locked:true, text:text}); }
});

document.getElementById("searchInput").addEventListener("input",(ev)=>{ searchTerm = ev.target.value; renderLedger(); });
ledgerToggle.addEventListener("click", ()=> ledgerEl.classList.toggle("open") );

/* =========================================================
   INIT
========================================================= */
buildTabs();
renderLedger();
updateEmptyState();

if(discovered.size===BASE_IDS.length){
  const rect = surfaceEl.getBoundingClientRect();
  const w = rect.width || 800, h = rect.height || 500;
  const cx = w/2, cy = h/2;
  const spots = [[-90,-46],[90,-46],[-90,46],[90,46]];
  BASE_IDS.forEach((id,i)=> placeToken(id, cx+spots[i][0], cy+spots[i][1]) );
}

})();
</script>
