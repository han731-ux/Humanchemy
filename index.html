<body>
<title>Icon Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#131009;
    --surface:#1d1811;
    --surface-2:#26201a;
    --surface-3:#2f2721;
    --line:#3a2f20;
    --line-soft:#2a2318;
    --gold:#c7a257;
    --gold-bright:#e8c572;
    --logo-gold:#d9b569;
    --logo-shadow:#7d5620;
    --verdigris:#5c8577;
    --oxide:#a34b3e;
    --text:#efe6d3;
    --text-dim:#b8a98a;
    --text-faint:#7a6f58;

    --c-science:#6e9c8f;
    --c-art:#c97b4a;
    --c-music:#b25d6b;
    --c-leaders:#c7a257;
    --c-thinkers:#7c8a99;
    --c-writers:#8a7ca8;
    --c-explorers:#4e88a2;
    --c-sports:#7fa35c;
    --c-icons:#9b7fa8;
    --c-elements:#7a6f58;

    --tier-notable:#8a7d63;
    --tier-renowned:#6ea3c9;
    --tier-legendary:#e8c572;
    --tier-mythic:#f0507a;

    --shadow-lift: 0 10px 30px -12px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'Archivo',ui-sans-serif,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  ::selection{background:var(--gold); color:var(--ink);}
  h1,h2,h3,h4,.display{ font-family:'Fraunces',Georgia,'Noto Serif KR',serif; text-wrap:balance; }
  .mono{ font-family:'Space Mono',ui-monospace,monospace; }
  button{ font-family:inherit; }
  input{ user-select:text; }

  .app{
    position:relative;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(199,162,87,.06), transparent 60%),
      radial-gradient(900px 500px at 100% 110%, rgba(92,133,119,.07), transparent 60%),
      var(--ink);
  }

  header.top{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 20px;
    border-bottom:1px solid var(--line-soft);
    background:linear-gradient(180deg, rgba(29,24,17,.9), rgba(29,24,17,.55));
    backdrop-filter:blur(6px);
    flex-shrink:0;
    z-index:20;
  }
  .wordmark{ display:flex; align-items:center; gap:10px; white-space:nowrap; }
  .mark-symbol{ width:17px; height:23px; flex-shrink:0; display:block; margin-top:-3px; }
  .wordmark .mark{ font-family:'Archivo',ui-sans-serif,system-ui,sans-serif; font-size:20px; font-weight:800; letter-spacing:-.01em; color:var(--logo-gold); }
  .wordmark .mark-rule{ width:1px; height:15px; background:var(--line); display:none; flex-shrink:0; margin-left:2px; }
  @media (min-width:1100px){ .wordmark .mark-rule{ display:inline-block; } }
  .wordmark .tag{ display:none; color:var(--text-faint); font-size:12px; font-style:italic; letter-spacing:.01em; padding-left:2px; }
  @media (min-width:1100px){ .wordmark .tag{ display:inline; } }

  .hof-btn{
    display:flex; align-items:center; gap:7px;
    border:1px solid var(--c-icons);
    background:linear-gradient(180deg, rgba(155,127,168,.16), rgba(155,127,168,.05));
    color:var(--text);
    padding:7px 12px;
    border-radius:999px;
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }
  .hof-btn:hover{ border-color:var(--gold-bright); }
  .hof-btn b{ color:var(--gold-bright); }

  .search-wrap{ flex:1; max-width:260px; position:relative; }
  .search-wrap input{ width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:9px 12px 9px 32px; font-size:13px; outline:none; }
  .search-wrap input::placeholder{ color:var(--text-faint); }
  .search-wrap input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(199,162,87,.15); }
  .search-wrap svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.5; pointer-events:none; }

  .top-actions{ display:flex; gap:8px; margin-left:auto; flex-shrink:0; }
  .btn{ border:1px solid var(--line); background:var(--surface); color:var(--text-dim); padding:8px 12px; border-radius:8px; font-size:12.5px; letter-spacing:.01em; cursor:pointer; display:flex; align-items:center; gap:6px; transition:border-color .15s, color .15s; }
  .btn:hover{ border-color:var(--gold); color:var(--text); }
  .btn:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:2px; }
  .btn svg{ width:14px; height:14px; }

  .layout{ flex:1; display:flex; min-height:0; position:relative; }

  .ledger{
    width:300px; flex-shrink:0;
    border-right:1px solid var(--line-soft);
    background:rgba(24,20,14,.6);
    display:flex; flex-direction:column; min-height:0;
    transition:box-shadow .2s, background .2s;
  }

  .ledger-tabs-wrap{ position:relative; flex-shrink:0; }
  .ledger-tabs-wrap::after{
    content:""; position:absolute; top:0; right:0; bottom:0; width:20px;
    background:linear-gradient(90deg, transparent, rgba(24,20,14,.75));
    pointer-events:none;
  }
  .ledger-tabs{
    display:flex; gap:6px; padding:12px 12px 8px; overflow-x:auto;
    scrollbar-width:thin; scrollbar-color:var(--line) transparent;
  }
  .ledger-tabs::-webkit-scrollbar{ height:5px; }
  .ledger-tabs::-webkit-scrollbar-track{ background:transparent; }
  .ledger-tabs::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .ledger-tabs::-webkit-scrollbar-thumb:hover{ background:var(--gold); }
  .tab{ flex-shrink:0; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--text-faint); background:transparent; border:1px solid var(--line); padding:6px 10px; border-radius:999px; cursor:pointer; white-space:nowrap; }
  .tab[data-active="true"]{ color:var(--ink); background:var(--tab-color, var(--gold)); border-color:transparent; font-weight:700; }

  .ledger-meta{
    display:flex; justify-content:space-between; align-items:center;
    padding:0 14px 8px; font-size:10.5px; color:var(--text-faint); flex-shrink:0;
  }
  .ledger-meta .mono b{ color:var(--gold-bright); }

  .ledger-scroll.no-scroll{ overflow:hidden !important; touch-action:none !important; }
  .ledger-scroll{
    flex:1; overflow-y:auto; overflow-x:hidden; padding:2px 12px 30px; touch-action:pan-y; overscroll-behavior:contain;
    scrollbar-width:thin; scrollbar-color:var(--line) transparent;
  }
  .ledger-scroll::-webkit-scrollbar{ width:5px; }
  .ledger-scroll::-webkit-scrollbar-track{ background:transparent; }
  .ledger-scroll::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
  .ledger-scroll::-webkit-scrollbar-thumb:hover{ background:var(--gold); }
  .ledger-group{ margin-bottom:18px; }
  .ledger-group h3{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); font-weight:600; margin:0 0 8px 2px; display:flex; align-items:center; gap:6px; }
  .ledger-group h3 .dot{ width:6px; height:6px; border-radius:50%; background:var(--grp-color, var(--gold)); display:inline-block; }
  .ledger-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(74px,1fr)); gap:6px; }

  .medallion{ all:unset; box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:5px; padding:8px 4px 7px; border-radius:12px; cursor:grab; touch-action:pan-y; text-align:center; position:relative; }
  .medallion:hover{ background:var(--surface-2); }
  .medallion:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:2px; }
  .coin{ width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:19px; background:radial-gradient(circle at 32% 28%, var(--surface-3), var(--surface)); border:1.5px solid var(--line); box-shadow: inset 0 0 0 3px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04); position:relative; pointer-events:none; }
  .medallion .coin{ pointer-events:auto; touch-action:none; }
  .medallion.discovered .coin{ border-color:var(--coin-color, var(--gold)); box-shadow: inset 0 0 0 3px rgba(0,0,0,.3), 0 0 0 1px rgba(199,162,87,.15); }
  .medallion.discovered.tier-legendary .coin{ box-shadow: inset 0 0 0 3px rgba(0,0,0,.25), 0 0 10px 1px rgba(232,197,114,.5); }
  .medallion.discovered.tier-mythic .coin{ box-shadow: inset 0 0 0 3px rgba(0,0,0,.2), 0 0 14px 2px rgba(240,80,122,.55); animation:shimmerSlow 5s ease-in-out infinite; }
  .medallion.locked .coin{ color:var(--text-faint); font-family:'Fraunces',serif; font-style:italic; opacity:.5; border-style:dashed; }
  .medallion.locked.person-slot .coin{ opacity:.4; font-style:normal; }
  .medallion .lbl{ font-size:10px; line-height:1.15; color:var(--text-dim); max-width:72px; pointer-events:none; }
  .medallion.locked .lbl{ color:var(--text-faint); }
  .medallion.discovered .lbl{ color:var(--text); }
  .person-mark{
    position:absolute; bottom:-3px; right:-3px; width:15px; height:15px; border-radius:50%;
    background:var(--surface-2); border:1.5px solid var(--coin-color,var(--tier-notable));
    display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,.55); z-index:1;
  }
  .person-mark.tier-renowned{ width:16px; height:16px; box-shadow:0 1px 4px rgba(0,0,0,.55), 0 0 6px rgba(110,163,201,.4); }
  .person-mark.tier-legendary{ width:18px; height:18px; box-shadow:0 1px 4px rgba(0,0,0,.55), 0 0 9px rgba(232,197,114,.55); }
  .person-mark.tier-mythic{ width:20px; height:20px; box-shadow:0 1px 4px rgba(0,0,0,.55), 0 0 11px rgba(240,80,122,.65); animation:shimmerSlow 4.6s ease-in-out infinite; }
  .token .person-mark{ bottom:-2px; right:-2px; width:19px; height:19px; }
  .token .person-mark.tier-renowned{ width:21px; height:21px; }
  .token .person-mark.tier-legendary{ width:23px; height:23px; }
  .token .person-mark.tier-mythic{ width:26px; height:26px; animation:none; }
  .medallion.discovered.tier-renowned .coin{ box-shadow: inset 0 0 0 3px rgba(0,0,0,.28), 0 0 8px 1px rgba(110,163,201,.4); }

  @keyframes shimmer{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.4); } }
  @keyframes shimmerSlow{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.15); } }

  .empty-note{ color:var(--text-faint); font-size:12px; padding:20px 8px; text-align:center; line-height:1.6; }

  .workbench{ flex:1; position:relative; min-width:0; overflow:hidden; }
  .workbench-surface{ position:absolute; inset:0; background: radial-gradient(circle at 50% 45%, rgba(199,162,87,.05), transparent 45%), var(--ink); overflow:hidden; touch-action:none; }
  .workbench-surface svg.etch{ position:absolute; inset:0; width:100%; height:100%; opacity:.35; pointer-events:none; -webkit-user-drag:none; }

  .wb-empty{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; padding:20px; }
  .wb-empty-inner{ text-align:center; max-width:360px; color:var(--text-faint); }
  .wb-empty-inner .coin{ width:56px;height:56px;font-size:26px;margin:0 auto 14px; }
  .wb-empty-inner h2{ font-size:19px; color:var(--text-dim); margin:0 0 8px; font-weight:600; }
  .wb-empty-inner p{ font-size:12.5px; line-height:1.6; margin:0; }
  .wb-empty-inner p b{ color:var(--gold-bright); font-weight:600; }

  .token{ position:absolute; left:0; top:0; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:grab; touch-action:none; will-change:transform; }
  .token .coin{ width:56px; height:56px; font-size:25px; box-shadow: inset 0 0 0 3px rgba(0,0,0,.3), var(--shadow-lift); border-width:2px; border-color:var(--coin-color, var(--gold)); }
  .token .lbl{ font-size:11px; background:rgba(19,16,9,.85); padding:2px 7px; border-radius:999px; color:var(--text); white-space:nowrap; border:1px solid var(--line-soft); pointer-events:none; }
  .token.lifted{ filter:drop-shadow(0 14px 20px rgba(0,0,0,.5)); }
  .token.lifted .coin{ cursor:grabbing; }
  .token.person .coin{ background:radial-gradient(circle at 32% 28%, #2f271b, #1d1811); }
  .token.tier-renowned .coin{ box-shadow: inset 0 0 0 3px rgba(0,0,0,.28), var(--shadow-lift), 0 0 10px 1px rgba(110,163,201,.35); }
  .token.tier-legendary .coin{ box-shadow: inset 0 0 0 3px rgba(0,0,0,.25), var(--shadow-lift), 0 0 14px 2px rgba(232,197,114,.5); }
  .token.tier-mythic .coin{ box-shadow: inset 0 0 0 3px rgba(0,0,0,.2), var(--shadow-lift), 0 0 18px 3px rgba(240,80,122,.55); }
  .token.miss .coin{ animation:shake .32s ease; }
  .token.mint .coin{ animation:mint .7s cubic-bezier(.2,.9,.3,1); }
  .token.mint-ring::after{ content:""; position:absolute; inset:-8px; border-radius:50%; border:2px solid var(--coin-color,var(--gold-bright)); animation:ring .7s ease-out forwards; }
  .token.mint-ring.tier-legendary::after{ inset:-12px; border-width:3px; animation-duration:1s; }
  .token.mint-ring.tier-mythic::after{ inset:-16px; border-width:3px; animation-duration:1.3s; }
  .token.delete-target{ opacity:.35; }
  .token.fixed-drag{ position:fixed; z-index:999; }

  @keyframes shake{ 0%,100%{ transform:translateX(0); } 25%{ transform:translateX(-4px); } 75%{ transform:translateX(4px); } }
  @keyframes mint{ 0%{ transform:scale(.6); filter:brightness(2.2); } 55%{ transform:scale(1.12); filter:brightness(1.5); } 100%{ transform:scale(1); filter:brightness(1); } }
  @keyframes ring{ 0%{ opacity:1; transform:scale(.6); } 100%{ opacity:0; transform:scale(2.4); } }

  .drag-ghost{ position:fixed; z-index:999; pointer-events:none; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:4px; }
  .drag-ghost .coin{ width:54px; height:54px; font-size:24px; box-shadow: 0 16px 30px -8px rgba(0,0,0,.7); border-width:2px; }
  .drag-ghost .lbl{ font-size:11px; background:rgba(19,16,9,.9); padding:2px 8px; border-radius:999px; color:var(--text); border:1px solid var(--line-soft); }

  .wb-toolbar{ position:absolute; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:8px; z-index:15; }

  #toastLayer{ position:fixed; top:66px; right:16px; display:flex; flex-direction:column; gap:8px; z-index:200; pointer-events:none; }
  .toast{ background:linear-gradient(180deg, var(--surface-2), var(--surface)); border:1px solid var(--gold); border-radius:10px; padding:10px 14px; display:flex; align-items:center; gap:10px; box-shadow:var(--shadow-lift); min-width:210px; max-width:270px; animation:toastIn .35s ease; }
  .toast .coin{ width:32px;height:32px;font-size:15px;flex-shrink:0; }
  .toast .tt-title{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold-bright); margin:0 0 2px; display:flex; gap:6px; align-items:center; }
  .toast .tt-name{ font-size:13px; font-weight:600; color:var(--text); }
  .toast .streak{ font-size:9.5px; color:var(--oxide); font-weight:700; background:rgba(163,75,62,.15); padding:1px 6px; border-radius:999px; }
  @keyframes toastIn{ from{ opacity:0; transform:translateX(14px); } to{ opacity:1; transform:translateX(0); } }
  .toast.leaving{ animation:toastOut .3s ease forwards; }
  @keyframes toastOut{ to{ opacity:0; transform:translateX(14px); } }

  .overlay-backdrop{ position:fixed; inset:0; background:rgba(10,8,5,.72); backdrop-filter:blur(3px); z-index:400; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn .25s ease; overflow:hidden; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .overlay-backdrop.tier-legendary::before, .overlay-backdrop.tier-mythic::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(circle at 50% 42%, var(--flash-color), transparent 62%);
    animation:flashPop .6s ease-out forwards;
  }
  .overlay-backdrop.tier-legendary::before{ --flash-color:rgba(232,197,114,.5); }
  .overlay-backdrop.tier-mythic::before{ --flash-color:rgba(240,80,122,.55); animation-duration:.8s; }
  @keyframes flashPop{ 0%{ opacity:1; } 100%{ opacity:0; } }

  .reveal-card{ position:relative; width:min(380px,100%); background:linear-gradient(180deg, var(--surface-2), var(--surface)); border:1.5px solid var(--coin-color,var(--gold)); border-radius:18px; padding:38px 26px 26px; text-align:center; box-shadow:0 30px 80px -20px rgba(0,0,0,.7); animation:cardIn .45s cubic-bezier(.2,.9,.25,1); }
  .reveal-card.tier-legendary{ box-shadow:0 30px 80px -20px rgba(0,0,0,.7), 0 0 60px -10px rgba(232,197,114,.35); }
  .reveal-card.tier-mythic{ box-shadow:0 30px 80px -20px rgba(0,0,0,.7), 0 0 80px -6px rgba(240,80,122,.45); animation:cardIn .45s cubic-bezier(.2,.9,.25,1), cardPulseMythic 2s ease-in-out 1s infinite; }
  @keyframes cardIn{ from{ transform:scale(.85) translateY(10px); opacity:0; } to{ transform:scale(1) translateY(0); opacity:1; } }
  @keyframes cardPulseMythic{ 0%,100%{ box-shadow:0 30px 80px -20px rgba(0,0,0,.7), 0 0 80px -6px rgba(240,80,122,.45); } 50%{ box-shadow:0 30px 80px -20px rgba(0,0,0,.7), 0 0 100px 0px rgba(240,80,122,.65); } }
  .rc-clip{ position:absolute; inset:0; border-radius:18px; overflow:hidden; pointer-events:none; }
  .reveal-card .burst{ position:absolute; inset:-40%; background:conic-gradient(from -45deg, transparent, rgba(138,125,99,.1), transparent 34%); }
  .reveal-card.tier-renowned .burst{ background:conic-gradient(from -45deg, transparent, rgba(110,163,201,.18), transparent 28%); }
  .reveal-card.tier-legendary .burst{ background:conic-gradient(from -45deg, transparent, rgba(232,197,114,.26), transparent 24%); }
  .reveal-card.tier-mythic .burst{ background:conic-gradient(from -45deg, transparent, rgba(240,80,122,.32), transparent 20%); }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .reveal-card .rc-inner{ position:relative; }

  .rc-banner{
    position:absolute; top:-16px; left:50%; transform:translateX(-50%);
    padding:6px 18px; border-radius:999px; font-size:10.5px; font-weight:800;
    text-transform:uppercase; letter-spacing:.1em; white-space:nowrap; z-index:3;
    box-shadow:0 6px 16px rgba(0,0,0,.45);
  }
  .rc-banner.tier-notable{ background:var(--tier-notable); color:#1c1710; }
  .rc-banner.tier-renowned{ background:var(--tier-renowned); color:#0c1c26; padding:7px 20px; font-size:11px; }
  .rc-banner.tier-legendary{
    background:linear-gradient(135deg, var(--tier-legendary), var(--gold-bright)); color:#2b2109;
    padding:8px 24px; font-size:12.5px; top:-19px;
  }
  .rc-banner.tier-mythic{
    background:linear-gradient(135deg, var(--tier-mythic), #ff9fb8); color:#3a0716;
    padding:9px 28px; font-size:13.5px; top:-22px; letter-spacing:.14em;
  }

  .reveal-coin-wrap{ position:relative; width:100px; height:100px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; }
  .sparkle{ position:absolute; font-size:11px; color:var(--coin-color); opacity:0; animation:sparkleTwinkle 1.8s ease-in-out infinite; pointer-events:none; }
  @keyframes sparkleTwinkle{ 0%,100%{ opacity:0; transform:scale(.3) rotate(0deg); } 50%{ opacity:1; transform:scale(1) rotate(90deg); } }

const ELEMENTS = RAW.map(row=>{
  const [id,name,emoji,r,cat,flavor,era,quote,why,tier] = row;
  return {id,name,emoji,r,cat,flavor,era:era||null,person:!!era,quote:quote||null,why:why||null,tier:tier||null};
});
const BY_ID = new Map(ELEMENTS.map(e=>[e.id,e]));
const CAT_BY_ID = new Map(CATS.map(c=>[c.id,c]));

const RECIPES = new Map();
const dupWarnings = [];
ELEMENTS.forEach(e=>{
  if(!e.r) return;
  const key = [e.r[0],e.r[1]].sort().join("|");
  if(RECIPES.has(key) && RECIPES.get(key)!==e.id) dupWarnings.push(`Dup ${key}: ${RECIPES.get(key)} vs ${e.id}`);
  RECIPES.set(key,e.id);
});
if(dupWarnings.length) console.warn("Icon Lab collisions ("+dupWarnings.length+"):\n"+dupWarnings.join("\n"));

const BASE_IDS = ["fire","water","earth","air"];
/* DEPTH = number of combine-steps from the four base elements to reach this
   one (BFS over the recipe graph). Tiers are derived purely from this — how
   hard a person is to reach — never from any judgment about who they were. */
const DEPTH = new Map(BASE_IDS.map(id=>[id,0]));
(function computeDepthAndCheckReachability(){
  let changed = true;
  while(changed){
    changed = false;
    ELEMENTS.forEach(e=>{
      if(DEPTH.has(e.id) || !e.r) return;
      const d0 = DEPTH.get(e.r[0]), d1 = DEPTH.get(e.r[1]);
      if(d0!==undefined && d1!==undefined){ DEPTH.set(e.id, Math.max(d0,d1)+1); changed = true; }
    });
  }
  const unreached = ELEMENTS.filter(e=>!DEPTH.has(e.id)).map(e=>e.id);
  if(unreached.length) console.warn("Icon Lab unreachable ("+unreached.length+"):", unreached);
  else console.log("Icon Lab: all "+ELEMENTS.length+" elements reachable, 0 collisions.");
})();

/* How many other recipes use this element as an ingredient — the ledger's
   tiebreaker sort (more broadly useful elements surface first within their
   own combine-depth tier). */
const USAGE_COUNT = new Map(ELEMENTS.map(e=>[e.id,0]));
ELEMENTS.forEach(e=>{
  if(!e.r) return;
  USAGE_COUNT.set(e.r[0], (USAGE_COUNT.get(e.r[0])||0)+1);
  USAGE_COUNT.set(e.r[1], (USAGE_COUNT.get(e.r[1])||0)+1);
});
const BASE_ORDER = new Map(BASE_IDS.map((id,i)=>[id,i]));
function ledgerSort(a,b){
  if(BASE_ORDER.has(a.id) && BASE_ORDER.has(b.id)) return BASE_ORDER.get(a.id)-BASE_ORDER.get(b.id);
  return (DEPTH.get(a.id)-DEPTH.get(b.id))
      || (USAGE_COUNT.get(b.id)-USAGE_COUNT.get(a.id))
      || a.name.localeCompare(b.name);
}

/* Depth->tier cutoffs, calibrated to this element tree's actual depth
   distribution (persons currently land at depth 3–6): the deepest, hardest
   combinations are Mythic; the shallowest, quickest ones are Notable. */
function tierOf(e){
  if(!e.person) return null;
  const d = DEPTH.get(e.id) || 0;
  if(d>=6) return "mythic";
  if(d===5) return "legendary";
  if(d===4) return "renowned";
  return "notable";
}
function personMarkHTML(tier){ return tier ? `<span class="person-mark tier-${tier}">${TIER_ORNAMENT[tier]}</span>` : ""; }
const TIER_COLOR = {notable:"var(--tier-notable)", renowned:"var(--tier-renowned)", legendary:"var(--tier-legendary)", mythic:"var(--tier-mythic)"};
const TIER_ORNAMENT = {
  notable: '<svg viewBox="0 0 16 16" width="8" height="8"><path d="M8 1 L14 8 L8 15 L2 8 Z" fill="currentColor"/></svg>',
  renowned: '<svg viewBox="0 0 16 16" width="10" height="10"><path d="M8 0 L9.5 6.5 L16 8 L9.5 9.5 L8 16 L6.5 9.5 L0 8 L6.5 6.5 Z" fill="currentColor"/></svg>',
  legendary: '<svg viewBox="0 0 16 16" width="12" height="12"><path d="M8 0 L9.79 5.53 L15.9 5.51 L11 8.95 L12.9 14.51 L8 11 L3.1 14.51 L5 8.95 L0.1 5.51 L6.21 5.53 Z" fill="currentColor"/></svg>',
  mythic: '<svg viewBox="0 0 16 16" width="14" height="14"><path d="M2 6 L5 9 L8 3 L11 9 L14 6 L14 13 L2 13 Z" fill="currentColor"/><circle cx="2" cy="6" r="1.3" fill="currentColor"/><circle cx="8" cy="3" r="1.3" fill="currentColor"/><circle cx="14" cy="6" r="1.3" fill="currentColor"/></svg>'
};
const TIER_ORDER = ["mythic","legendary","renowned","notable"];
function ringColor(e){ const t = tierOf(e); return t ? TIER_COLOR[t] : CAT_BY_ID.get(e.cat).color; }

const PERSONS = ELEMENTS.filter(e=>e.person);
const TOTAL = ELEMENTS.length;
document.getElementById("personTotal").textContent = PERSONS.length;

const LS_KEY = "iconsrecipe.discovered.v1";
let discovered = new Set(BASE_IDS);
try{
  const saved = JSON.parse(localStorage.getItem(LS_KEY) || "null");
  if(Array.isArray(saved) && saved.length) discovered = new Set(saved.filter(id=>BY_ID.has(id)));
}catch(e){}
function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...discovered])); }catch(e){} }

let activeCat = "all";
let searchTerm = "";
let lastDiscoverAt = 0;
let streak = 0;

const ledgerTabsEl = document.getElementById("ledgerTabs");
const ledgerScrollEl = document.getElementById("ledgerScroll");
const ledgerMetaText = document.getElementById("ledgerMetaText");
const surfaceEl = document.getElementById("surface");
const wbEmptyEl = document.getElementById("wbEmpty");
const personCountEl = document.getElementById("personCount");
const toastLayer = document.getElementById("toastLayer");
const ledgerEl = document.getElementById("ledger");
const ledgerToggle = document.getElementById("ledgerToggle");

/* =========================================================
   LEDGER RENDERING
========================================================= */
function buildTabs(){
  const tabs = [{id:"all",label:"All",color:"var(--gold)"}, ...CATS];
  ledgerTabsEl.innerHTML = "";
  tabs.forEach(t=>{
    const b = document.createElement("button");
    b.className = "tab";
    b.textContent = t.label;
    b.style.setProperty("--tab-color", t.color);
    b.dataset.active = String(t.id===activeCat);
    b.addEventListener("click", ()=>{ activeCat = t.id; renderLedger(); buildTabs(); ledgerScrollEl.scrollTop = 0; });
    ledgerTabsEl.appendChild(b);
  });
}
ledgerTabsEl.addEventListener("wheel", (e)=>{
  if(ledgerTabsEl.scrollWidth > ledgerTabsEl.clientWidth){
    e.preventDefault();
    ledgerTabsEl.scrollLeft += (e.deltaY || e.deltaX);
  }
}, {passive:false});

function renderLedger(){
  const q = searchTerm.trim().toLowerCase();
  const groups = activeCat==="all" ? CATS : CATS.filter(c=>c.id===activeCat);
  ledgerScrollEl.innerHTML = "";
  let any = false;

  groups.forEach(cat=>{
    let items = ELEMENTS.filter(e=>e.cat===cat.id);
    if(q) items = items.filter(e=> discovered.has(e.id) && e.name.toLowerCase().includes(q) );
    if(!items.length) return;
    items = items.slice().sort(ledgerSort);
    any = true;
    const g = document.createElement("div");
    g.className = "ledger-group";
    const h = document.createElement("h3");
    h.style.setProperty("--grp-color", cat.color);
    h.innerHTML = `<span class="dot"></span>${cat.label} <span class="mono" style="font-weight:400;color:var(--text-faint)">(${items.filter(i=>discovered.has(i.id)).length}/${items.length})</span>`;
    g.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "ledger-grid";
    items.forEach(e=> grid.appendChild(makeMedallion(e)) );
    g.appendChild(grid);
    ledgerScrollEl.appendChild(g);
  });

  if(!any){
    const p = document.createElement("div");
    p.className = "empty-note";
    p.textContent = q ? "No discovered icons match your search." : "Nothing here yet — go combine something.";
    ledgerScrollEl.appendChild(p);
  }

  ledgerMetaText.textContent = `${discovered.size}/${TOTAL} discovered`;
  personCountEl.textContent = PERSONS.filter(p=>discovered.has(p.id)).length;
}

function makeMedallion(e){
  const isKnown = discovered.has(e.id);
  const tier = tierOf(e);
  const el = document.createElement("button");
  el.className = "medallion " + (isKnown ? "discovered" : "locked") + (e.person?" person-slot":"") + (tier?" tier-"+tier:"");
  el.dataset.id = e.id;
  const cat = CAT_BY_ID.get(e.cat);
  const lockedGlyph = e.person ? "👤" : "?";
  el.innerHTML = `
    <span class="coin" style="--coin-color:${isKnown ? ringColor(e) : cat.color}">${isKnown ? e.emoji : lockedGlyph}${isKnown ? personMarkHTML(tier) : ""}</span>
    <span class="lbl">${isKnown ? e.name : "???"}</span>
  `;
  if(isKnown){
    el.addEventListener("pointerdown", (ev)=>{
      // Right-click (and middle-click) should only open the recipe popover via
      // the "contextmenu" listener below — never start a drag/placement too.
      if(ev.pointerType === "mouse" && ev.button !== 0) return;
      // Desktop: mouse-wheel scrolling never competes with a mouse drag, so the whole
      // row is grabbable. Touch: only the icon starts a drag (see startSidebarDrag) —
      // everything else stays a pure scroll area.
      if(!isTouch || ev.target.closest(".coin")) startSidebarDrag(ev, e.id);
      else startLabelTap(ev, e.id);
    });
    attachComboMenu(el, e.id);
    el.title = e.name + (tier ? ` · ${TIERS[tier].label} · ${cat.label}` : "");
  }else{
    el.addEventListener("click", ()=> toast({locked:true, text:"Not discovered yet — try combining related elements."}) );
  }
  return el;
}

/* =========================================================
   TOASTS (regular elements)
========================================================= */
function toast({id, locked, text}){
  const div = document.createElement("div");
  div.className = "toast";
  if(locked){
    div.innerHTML = `<span class="coin" style="--coin-color:var(--text-faint)">?</span>
      <div><div class="tt-title">Codex</div><div class="tt-name" style="font-weight:500;font-size:12px;color:var(--text-dim)">${text}</div></div>`;
  }else{
    const e = BY_ID.get(id);
    const cat = CAT_BY_ID.get(e.cat);
    const showStreak = streak>=2 ? `<span class="streak">🔥 ${streak} in a row</span>` : "";
    div.innerHTML = `<span class="coin" style="--coin-color:${cat.color}">${e.emoji}</span>
      <div><div class="tt-title">New Discovery ${showStreak}</div><div class="tt-name">${e.name}</div></div>`;
  }
  toastLayer.appendChild(div);
  setTimeout(()=>{ div.classList.add("leaving"); setTimeout(()=>div.remove(), 320); }, 2600);
}

/* =========================================================
   REVEAL MODAL (person discovery)
========================================================= */
function sparkleHTML(tier){
  const count = tier==="mythic" ? 8 : 6;
  const glyphs = ["✦","✧","✦","✧","✦","✧","✦","✧"];
  const radius = tier==="mythic" ? 66 : 58;
  let out = "";
  for(let i=0;i<count;i++){
    const rad = ((360/count)*i) * Math.PI/180;
    const cx = 50 + Math.cos(rad)*radius;
    const cy = 50 + Math.sin(rad)*radius;
    const delay = (i*0.22).toFixed(2);
    out += `<span class="sparkle" style="left:${cx}%; top:${cy}%; animation-delay:${delay}s; font-size:${tier==='mythic'?13:11}px;">${glyphs[i]}</span>`;
  }
  return out;
}

function showReveal(id){
  const e = BY_ID.get(id);
  const cat = CAT_BY_ID.get(e.cat);
  const tier = tierOf(e);
  const backdrop = document.createElement("div");
  backdrop.className = "overlay-backdrop tier-"+tier;
  const bannerText = tier==="mythic" ? "★ Mythic Icon Forged ★" : tier==="legendary" ? "★ Legendary Icon Forged ★" : tier==="renowned" ? "Renowned Icon Forged" : "New Icon Forged";
  const showSparkles = tier==="legendary" || tier==="mythic";
  backdrop.innerHTML = `
    <div class="reveal-card tier-${tier}" style="--coin-color:${TIER_COLOR[tier]}">
      <div class="rc-clip"><div class="burst"></div></div>
      <div class="rc-banner tier-${tier}">${bannerText}</div>
      <div class="rc-inner">
        <div class="reveal-coin-wrap">
          ${showSparkles ? sparkleHTML(tier) : ""}
          <div class="reveal-coin">${e.emoji}</div>
        </div>
        <h3>${e.name}</h3>
        <div class="reveal-badges">
          <span class="badge tier-${tier}"><b>${TIERS[tier].label}</b></span>
          <span class="badge cat" style="--cat-color:${cat.color}">${cat.label}</span>
          ${e.era==='living' ? '<span class="badge era-living">Living</span>' : '<span class="badge">Historical</span>'}
        </div>
        <p class="reveal-quote">${e.quote}</p>
        <p class="reveal-blurb">${e.flavor}</p>
        <button class="reveal-close">Continue</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  function close(){ backdrop.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(ev){ if(ev.key==="Escape") close(); }
  backdrop.addEventListener("click", (ev)=>{ if(ev.target===backdrop) close(); });
  backdrop.querySelector(".reveal-close").addEventListener("click", close);
  document.addEventListener("keydown", onKey);
}

/* =========================================================
   HALL OF FAME
========================================================= */
function openHallOfFame(){
  const backdrop = document.createElement("div");
  backdrop.className = "hof-backdrop";
  const found = PERSONS.filter(p=>discovered.has(p.id)).length;
  const cards = TIER_ORDER.map(tier=>{
    const group = PERSONS.filter(p=>tierOf(p)===tier).sort((a,b)=>a.name.localeCompare(b.name));
    const foundInGroup = group.filter(p=>discovered.has(p.id)).length;
    const orn = TIER_ORNAMENT[tier];
    const groupCards = group.map(p=>{
      const known = discovered.has(p.id);
      const cat = CAT_BY_ID.get(p.cat);
      if(!known){
        return `<div class="hof-card locked tier-${tier}">
          <span class="hc-badge tier-${tier}">${TIERS[tier].label}</span>
          <span class="coin" style="--coin-color:var(--text-faint)">👤</span>
          <div class="hc-name">???</div>
        </div>`;
      }
      return `<div class="hof-card tier-${tier}" style="--coin-color:${TIER_COLOR[tier]}">
        <span class="hc-badge tier-${tier}">${TIERS[tier].label}</span>
        <span class="coin" style="--coin-color:${TIER_COLOR[tier]}">${p.emoji}</span>
        <div class="hc-name"><span class="hc-orn" style="color:${TIER_COLOR[tier]}">${orn}</span>${p.name}<span class="hc-orn" style="color:${TIER_COLOR[tier]}">${orn}</span></div>
        <div class="hc-cat" style="color:${cat.color}">${cat.label}</div>
        <div class="hc-quote">"${p.quote}"</div>
      </div>`;
    }).join("");
    return `<div class="hof-section">
      <h3 class="hof-section-head tier-${tier}"><span class="hc-orn" style="color:${TIER_COLOR[tier]}">${orn}</span>${TIERS[tier].label}<span class="mono hof-section-count">${foundInGroup}/${group.length}</span></h3>
      <div class="hof-grid">${groupCards}</div>
    </div>`;
  }).join("");
  backdrop.innerHTML = `
    <div class="hof-panel">
      <div class="hof-head">
        <div>
          <h2>Hall of Fame</h2>
          <p>${found} of ${PERSONS.length} icons forged</p>
          <p class="hof-subnote">Tiers are ordered by how hard each icon is to make — hardest first, not fame.</p>
        </div>
        <button class="hof-close" id="hofClose">&times;</button>
      </div>
      <div class="hof-tierlegend">
        <span><i style="background:var(--tier-mythic)"></i>Mythic — the longest, hardest combination chain</span>
        <span><i style="background:var(--tier-legendary)"></i>Legendary — a long chain of combines</span>
        <span><i style="background:var(--tier-renowned)"></i>Renowned — a moderate chain of combines</span>
        <span><i style="background:var(--tier-notable)"></i>Notable — reachable in just a few combines</span>
      </div>
      ${cards}
    </div>
  `;
  document.body.appendChild(backdrop);
  function close(){ backdrop.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(ev){ if(ev.key==="Escape") close(); }
  backdrop.addEventListener("click",(ev)=>{ if(ev.target===backdrop) close(); });
  backdrop.querySelector("#hofClose").addEventListener("click", close);
  document.addEventListener("keydown", onKey);
}
document.getElementById("hofBtn").addEventListener("click", openHallOfFame);

/* =========================================================
   COMBO POPOVER (right-click / long-press) — recipe + rationale + share
========================================================= */
let openPopover = null;
function closePopover(){ if(openPopover){ openPopover.remove(); openPopover=null; document.removeEventListener("click", onDocClick, true); } }
function onDocClick(ev){ if(openPopover && !openPopover.contains(ev.target)) closePopover(); }

function showComboPopover(elemId, x, y){
  closePopover();
  const e = BY_ID.get(elemId);
  const cat = CAT_BY_ID.get(e.cat);
  const pop = document.createElement("div");
  pop.className = "combo-pop";

  const tier = tierOf(e);
  let eqHtml, shareText;
  if(!e.r){
    eqHtml = `<span class="coin" style="--coin-color:${ringColor(e)}">${e.emoji}</span>`;
    shareText = `${e.emoji} ${e.name} — one of the four founding elements on Icon Lab.`;
  }else{
    const a = BY_ID.get(e.r[0]), b = BY_ID.get(e.r[1]);
    eqHtml = `<span class="coin" style="--coin-color:${ringColor(a)}">${a.emoji}</span>
      <span class="cp-plus">+</span>
      <span class="coin" style="--coin-color:${ringColor(b)}">${b.emoji}</span>
      <span class="cp-eq-sign">=</span>
      <span class="coin" style="--coin-color:${ringColor(e)}">${e.emoji}</span>`;
    shareText = `${a.name} + ${b.name} = ${e.name} — on Icon Lab`;
  }
  const rationale = e.why || e.flavor || "";
  pop.innerHTML = `
    <div class="cp-eq">${eqHtml}</div>
    <h4>${e.name}</h4>
    ${tier ? `<div class="cp-tier" style="color:${TIER_COLOR[tier]}">${TIERS[tier].label} · ${cat.label}</div>` : ""}
    <p>${rationale}</p>
    <div class="cp-actions">
      <button class="cp-share">Share combo</button>
      <button class="cp-close">Close</button>
    </div>
  `;
  document.body.appendChild(pop);
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  const vx = Math.min(Math.max(x - pw/2, 10), window.innerWidth - pw - 10);
  const vy = Math.min(Math.max(y - ph - 14, 10), window.innerHeight - ph - 10);
  pop.style.left = vx+"px";
  pop.style.top = vy+"px";
  pop.querySelector(".cp-close").addEventListener("click", closePopover);
  pop.querySelector(".cp-share").addEventListener("click", async ()=>{
    try{ await navigator.clipboard.writeText(shareText); toast({locked:true, text:"Combo copied to clipboard!"}); }
    catch(err){ toast({locked:true, text:shareText}); }
    closePopover();
  });
  openPopover = pop;
  setTimeout(()=> document.addEventListener("click", onDocClick, true), 10);
}

function attachComboMenu(el, elemId){
  el.addEventListener("contextmenu", (ev)=>{
    ev.preventDefault();
    if(discovered.has(elemId)) showComboPopover(elemId, ev.clientX, ev.clientY);
  });
  let pressTimer=null, pressStart=null;
  el.addEventListener("pointerdown", (ev)=>{
    pressStart = {x:ev.clientX, y:ev.clientY};
    pressTimer = setTimeout(()=>{
      pressTimer=null;
      if(discovered.has(elemId)) showComboPopover(elemId, ev.clientX, ev.clientY);
    }, 550);
  });
  const cancelPress = ()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } };
  el.addEventListener("pointerup", cancelPress);
  el.addEventListener("pointerleave", cancelPress);
  el.addEventListener("pointermove", (ev)=>{
    if(pressStart && Math.hypot(ev.clientX-pressStart.x, ev.clientY-pressStart.y) > 10) cancelPress();
  });
}

/* =========================================================
   WORKBENCH TOKENS + DRAG ENGINE v2
   - transform:translate3d for GPU-smooth movement (fixes lag)
   - requestAnimationFrame batching
   - elementFromPoint hit-testing for combine target (fixes "wrong icon" bug)
   - drag reparents to <body> as position:fixed so it visually travels
     anywhere on screen, incl. over the ledger (fixes delete-drag bug)
========================================================= */
let tokenSeq = 0;
let zCounter = 1;
let lastTapKey = null, lastTapAt = 0;
const tokens = new Map();
const clamp = (v,min,max)=> Math.min(Math.max(v,min),max);

function updateEmptyState(){ wbEmptyEl.style.display = tokens.size ? "none" : "flex"; }

function setTokenXY(el,x,y){ el.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%,-50%)`; }

function placeToken(elemId, x, y){
  const key = "tk"+(tokenSeq++);
  const e = BY_ID.get(elemId);
  const cat = CAT_BY_ID.get(e.cat);
  const tier = tierOf(e);
  const el = document.createElement("div");
  el.className = "token" + (e.person ? " person" : "") + (tier ? " tier-"+tier : "");
  el.dataset.key = key;
  el.style.setProperty("--coin-color", ringColor(e));
  el.style.zIndex = String(++zCounter);
  setTokenXY(el, x, y);
  el.innerHTML = `<span class="coin">${e.emoji}${personMarkHTML(tier)}</span><span class="lbl">${e.name}</span>`;
  el.addEventListener("pointerdown",(ev)=> startTokenDrag(ev,key));
  el.addEventListener("dblclick",(ev)=>{
    ev.preventDefault();
    ev.stopPropagation();
    const t = tokens.get(key);
    if(!t) return;
    placeToken(elemId, t.x, t.y);
  });
  attachComboMenu(el, elemId);
  surfaceEl.appendChild(el);
  tokens.set(key,{id:elemId,x,y,el});
  updateEmptyState();
  return key;
}

function removeToken(key){
  const t = tokens.get(key);
  if(!t) return;
  t.el.remove();
  tokens.delete(key);
  updateEmptyState();
}

function isPointOverLedger(clientX, clientY){
  const r = ledgerEl.getBoundingClientRect();
  return clientX>=r.left && clientX<=r.right && clientY>=r.top && clientY<=r.bottom;
}

function findTokenKeyAt(clientX, clientY, excludeEl){
  if(excludeEl) excludeEl.style.pointerEvents = "none";
  const hit = document.elementFromPoint(clientX, clientY);
  if(excludeEl) excludeEl.style.pointerEvents = "";
  const tokEl = hit && hit.closest && hit.closest(".token");
  if(!tokEl) return null;
  const key = tokEl.dataset.key;
  return (key && tokens.has(key)) ? key : null;
}

/* ---- drag from sidebar: spawns a new token ---- */
function startSidebarDrag(ev, elemId){
  // Only ever started from the coin icon itself (see makeMedallion) — the icon has
  // touch-action:none, so the browser never contests this gesture as a scroll, and
  // any direction of movement can be treated as a deliberate drag. Belt-and-braces:
  // also hard-lock the scroll container itself for the duration of the press, so a
  // touch that starts right on the coin's edge can never bleed into a list scroll.
  ledgerScrollEl.classList.add("no-scroll");
  const startX = ev.clientX, startY = ev.clientY;
  let dragging = false;
  let ghost = null;

  function makeGhost(){
    const e = BY_ID.get(elemId);
    const cat = CAT_BY_ID.get(e.cat);
    ghost = document.createElement("div");
    ghost.className = "drag-ghost";
    ghost.style.setProperty("--coin-color", cat.color);
    ghost.innerHTML = `<span class="coin">${e.emoji}</span><span class="lbl">${e.name}</span>`;
    document.body.appendChild(ghost);
    moveGhost(startX,startY);
  }
  function moveGhost(x,y){ if(ghost){ ghost.style.left=x+"px"; ghost.style.top=y+"px"; } }

  function onMove(mv){
    if(!dragging){
      if(Math.hypot(mv.clientX-startX, mv.clientY-startY) < 6) return;
      dragging = true;
      makeGhost();
    }
    mv.preventDefault();
    moveGhost(mv.clientX, mv.clientY);
  }
  function onUp(up){
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onUp);
    ledgerScrollEl.classList.remove("no-scroll");
    if(ghost) ghost.remove();

    const rect = surfaceEl.getBoundingClientRect();
    if(!dragging){
      const cx = rect.width/2 + (Math.random()*80-40);
      const cy = rect.height/2 + (Math.random()*80-40);
      dropNewToken(elemId, cx, cy);
      return;
    }
    const inSurface = up.clientX>=rect.left && up.clientX<=rect.right && up.clientY>=rect.top && up.clientY<=rect.bottom;
    if(inSurface){
      dropNewToken(elemId, up.clientX-rect.left, up.clientY-rect.top);
    }
  }
  window.addEventListener("pointermove", onMove, {passive:false});
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);
}

/* Starting a press on the label/padding of a medallion (not the icon) never
   blocks scrolling — no preventDefault, no pointermove listener at all. If it
   turns out to be a quick tap in place, spawn a token; otherwise it was a scroll
   and this does nothing. */
function startLabelTap(ev, elemId){
  const startX = ev.clientX, startY = ev.clientY, startTime = Date.now();
  function onUp(up){
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onCancel);
    const dist = Math.hypot(up.clientX-startX, up.clientY-startY);
    if(dist < 8 && Date.now()-startTime < 500){
      const rect = surfaceEl.getBoundingClientRect();
      const cx = rect.width/2 + (Math.random()*80-40);
      const cy = rect.height/2 + (Math.random()*80-40);
      dropNewToken(elemId, cx, cy);
    }
  }
  function onCancel(){ window.removeEventListener("pointerup", onUp); window.removeEventListener("pointercancel", onCancel); }
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onCancel);
}

function dropNewToken(elemId, x, y){
  const rect = surfaceEl.getBoundingClientRect();
  const cx = clamp(x, 30, rect.width-30), cy = clamp(y, 30, rect.height-30);
  const key = placeToken(elemId, cx, cy);
  const t = tokens.get(key);
  const targetKey = findTokenKeyAt(rect.left+cx, rect.top+cy, t.el);
  if(targetKey) attemptCombine(key, targetKey);
}

/* ---- drag an existing token: move / combine / delete-on-ledger ---- */
function startTokenDrag(ev, key){
  ev.stopPropagation();
  const t = tokens.get(key);
  if(!t) return;

  const startClientX = ev.clientX, startClientY = ev.clientY;
  let phase = "pending"; // pending -> dragging. Stays "pending" (no DOM changes at all) for a plain click/dblclick.
  let offsetX = 0, offsetY = 0;

  function beginDrag(cx,cy){
    const rect = t.el.getBoundingClientRect();
    offsetX = cx - (rect.left + rect.width/2);
    offsetY = cy - (rect.top + rect.height/2);
    t.el.classList.add("lifted","fixed-drag");
    document.body.appendChild(t.el);
    t.el.style.zIndex = String(++zCounter);
    setTokenXY(t.el, cx-offsetX, cy-offsetY);
    phase = "dragging";
  }

  function onMove(mv){
    if(phase==="pending"){
      if(Math.hypot(mv.clientX-startClientX, mv.clientY-startClientY) < 5) return;
      beginDrag(mv.clientX, mv.clientY);
    }
    setTokenXY(t.el, mv.clientX-offsetX, mv.clientY-offsetY);
    const overLedger = isPointOverLedger(mv.clientX, mv.clientY);
    t.el.classList.toggle("delete-target", overLedger);
  }
  function onUp(up){
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    if(phase==="pending"){
      // plain tap. On mouse, native "dblclick" (listener below) handles duplication.
      // Touch browsers largely don't synthesize dblclick from double-tap, so detect it ourselves.
      if(up.pointerType==="touch"){
        const now = Date.now();
        if(lastTapKey===key && now-lastTapAt < 350){
          lastTapKey = null; lastTapAt = 0;
          const t2 = tokens.get(key);
          if(t2) placeToken(t2.id, t2.x, t2.y);
        }else{
          lastTapKey = key; lastTapAt = now;
        }
      }
      return;
    }
    t.el.classList.remove("lifted","delete-target");

    if(isPointOverLedger(up.clientX, up.clientY)){
      t.el.style.transition = "opacity .16s ease, transform .16s ease";
      setTokenXY(t.el, up.clientX-offsetX, up.clientY-offsetY);
      t.el.style.opacity = "0";
      requestAnimationFrame(()=>{
        t.el.style.transform += " scale(.5)";
      });
      setTimeout(()=>{ t.el.remove(); tokens.delete(key); updateEmptyState(); }, 170);
      return;
    }

    const surfRect = surfaceEl.getBoundingClientRect();
    const nx = clamp(up.clientX-offsetX-surfRect.left, 30, surfRect.width-30);
    const ny = clamp(up.clientY-offsetY-surfRect.top, 30, surfRect.height-30);
    t.el.classList.remove("fixed-drag");
    surfaceEl.appendChild(t.el);
    t.x = nx; t.y = ny;
    setTokenXY(t.el, nx, ny);

    const targetKey = findTokenKeyAt(up.clientX, up.clientY, t.el);
    if(targetKey) attemptCombine(key, targetKey);
  }
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
}

function attemptCombine(keyA, keyB){
  const a = tokens.get(keyA), b = tokens.get(keyB);
  if(!a || !b) return;
  const recipeKey = [a.id,b.id].sort().join("|");
  const resultId = RECIPES.get(recipeKey);

  if(!resultId){
    [a.el,b.el].forEach(el=>{ el.classList.add("miss"); setTimeout(()=>el.classList.remove("miss"), 350); });
    return;
  }

  const midX = (a.x+b.x)/2, midY = (a.y+b.y)/2;
  removeToken(keyA);
  removeToken(keyB);
  const isNew = !discovered.has(resultId);
  const newKey = placeToken(resultId, midX, midY);
  const t = tokens.get(newKey);
  t.el.classList.add("mint");
  if(isNew) t.el.classList.add("mint-ring");
  const mintTier = tierOf(BY_ID.get(resultId));
  const mintDur = mintTier==="mythic" ? 1400 : mintTier==="legendary" ? 1100 : 720;
  setTimeout(()=>t.el.classList.remove("mint","mint-ring"), mintDur);

  if(isNew){
    const now = Date.now();
    streak = (now-lastDiscoverAt < 4000) ? streak+1 : 1;
    lastDiscoverAt = now;

    discovered.add(resultId);
    persist();
    renderLedger();

    const result = BY_ID.get(resultId);
    if(result.person) showReveal(resultId);
    else toast({id:resultId});
  }
}

/* =========================================================
   HINT (ad-gated)
   NOTE: this is a mocked ad — no real ad network is wired up here.
   The Artifact sandbox can't load third-party ad SDKs anyway; swap
   renderAd() for a real rewarded-ad call once this ships to a real host.
========================================================= */
function getHintCandidate(){
  const reachable = ELEMENTS.filter(e => !discovered.has(e.id) && e.r && discovered.has(e.r[0]) && discovered.has(e.r[1]));
  if(!reachable.length) return null;

  // 75% a plain element, 25% a person — split by tier: 12% notable / 9% renowned / 3% legendary / 1% mythic
  const buckets = {
    elements:  reachable.filter(e => !e.person),
    notable:   reachable.filter(e => e.person && tierOf(e)==="notable"),
    renowned:  reachable.filter(e => e.person && tierOf(e)==="renowned"),
    legendary: reachable.filter(e => e.person && tierOf(e)==="legendary"),
    mythic:    reachable.filter(e => e.person && tierOf(e)==="mythic"),
  };

  const roll = Math.random()*100;
  const picked = roll<75 ? "elements" : roll<87 ? "notable" : roll<96 ? "renowned" : roll<99 ? "legendary" : "mythic";

  // fall back down the same list if the rolled bucket happens to be empty right now
  for(const name of [picked,"elements","notable","renowned","legendary","mythic"]){
    const pool = buckets[name];
    if(pool.length) return pool[Math.floor(Math.random()*pool.length)];
  }
  return null;
}

function openHintFlow(){
  const target = getHintCandidate();
  const backdrop = document.createElement("div");
  backdrop.className = "overlay-backdrop";
  document.body.appendChild(backdrop);

  function close(){ backdrop.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(ev){ if(ev.key==="Escape") close(); }
  document.addEventListener("keydown", onKey);
  backdrop.addEventListener("click",(ev)=>{ if(ev.target===backdrop) close(); });

  function renderGate(){
    if(!target){
      backdrop.innerHTML = `<div class="ad-card">
        <div class="ad-icon">🎉</div>
        <h3>Nothing to hint right now</h3>
        <p>Everything reachable from what's on your bench is already discovered. Try combining what you have in new ways.</p>
        <div class="ad-actions"><button class="btn primary" id="hintClose">Close</button></div>
      </div>`;
      backdrop.querySelector("#hintClose").addEventListener("click", close);
      return;
    }
    backdrop.innerHTML = `<div class="ad-card">
      <div class="ad-icon">💡</div>
      <h3>Need a hint?</h3>
      <p>Watch a short ad to reveal two elements you already have that combine into something new.</p>
      <div class="ad-actions">
        <button class="btn" id="hintCancel">Not now</button>
        <button class="btn primary" id="hintWatch">▶ Watch Ad</button>
      </div>
    </div>`;
    backdrop.querySelector("#hintCancel").addEventListener("click", close);
    backdrop.querySelector("#hintWatch").addEventListener("click", renderAd);
  }

  function renderAd(){
    const DURATION = 6;
    backdrop.innerHTML = `<div class="ad-card">
      <div class="ad-mock-screen"><b><span class="ad-dot"></span>Playing sponsor message…</b>(Placeholder — a real deployment shows an actual rewarded video ad here.)</div>
      <div class="ad-progress-track"><div class="ad-progress-fill" id="adFill"></div></div>
      <div class="ad-timer-text" id="adTimer">Reward unlocks in ${DURATION}s…</div>
    </div>`;
    const fill = backdrop.querySelector("#adFill");
    const timerText = backdrop.querySelector("#adTimer");
    let elapsed = 0;
    const iv = setInterval(()=>{
      elapsed += 0.1;
      fill.style.width = Math.min(100,(elapsed/DURATION)*100) + "%";
      const remain = Math.max(0, DURATION-elapsed);
      timerText.textContent = remain>0.05 ? `Reward unlocks in ${remain.toFixed(1)}s…` : "Unlocking…";
      if(elapsed>=DURATION){ clearInterval(iv); renderReveal(); }
    }, 100);
  }

  function renderReveal(){
    const a = BY_ID.get(target.r[0]), b = BY_ID.get(target.r[1]);
    backdrop.innerHTML = `<div class="ad-card">
      <div class="ad-icon">✅</div>
      <h3>Here's your hint</h3>
      <div class="hint-eq">
        <span class="coin" style="--coin-color:${ringColor(a)}">${a.emoji}</span>
        <span class="plus">+</span>
        <span class="coin" style="--coin-color:${ringColor(b)}">${b.emoji}</span>
      </div>
      <p>${a.name} + ${b.name} = <b>???</b> — combine them on your bench to find out.</p>
      <div class="ad-actions">
        <button class="btn" id="hintDone">Got it</button>
        <button class="btn primary" id="hintPlace">Place on bench</button>
      </div>
    </div>`;
    backdrop.querySelector("#hintDone").addEventListener("click", close);
    backdrop.querySelector("#hintPlace").addEventListener("click", ()=>{
      const rect = surfaceEl.getBoundingClientRect();
      placeToken(a.id, clamp(rect.width/2-50, 30, rect.width-30), clamp(rect.height/2, 30, rect.height-30));
      placeToken(b.id, clamp(rect.width/2+50, 30, rect.width-30), clamp(rect.height/2, 30, rect.height-30));
      close();
    });
  }

  renderGate();
}

/* =========================================================
   IDEA BOARD — community suggestions with voting, backed by the
   artifact's shared database. See capability notes at publish time
   for what this can and can't guarantee.
========================================================= */
let dbApi = null;
let ideasUnsub = null;
(async function initDb(){
  try{ dbApi = (window.claude && typeof window.claude.use==="function") ? await window.claude.use("db") : null; }
  catch(e){ dbApi = null; }
})();

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function getVoterKey(){
  let k = localStorage.getItem("iconsrecipe.voterKey");
  if(!k){ k = "v_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,10); try{ localStorage.setItem("iconsrecipe.voterKey", k); }catch(e){} }
  return k;
}
function getVotedSet(){
  try{ return new Set(JSON.parse(localStorage.getItem("iconsrecipe.votedIdeas")||"[]")); }catch(e){ return new Set(); }
}
function markVoted(id){
  const s = getVotedSet(); s.add(id);
  try{ localStorage.setItem("iconsrecipe.votedIdeas", JSON.stringify([...s])); }catch(e){}
}
function unmarkVoted(id){
  const s = getVotedSet(); s.delete(id);
  try{ localStorage.setItem("iconsrecipe.votedIdeas", JSON.stringify([...s])); }catch(e){}
}

function openIdeaBoard(){
  const backdrop = document.createElement("div");
  backdrop.className = "overlay-backdrop";
  document.body.appendChild(backdrop);
  let mode = "browse";

  function close(){
    if(ideasUnsub){ ideasUnsub(); ideasUnsub = null; }
    backdrop.remove();
    document.removeEventListener("keydown", onKey);
  }
  function onKey(ev){ if(ev.key==="Escape") close(); }
  document.addEventListener("keydown", onKey);
  backdrop.addEventListener("click",(ev)=>{ if(ev.target===backdrop) close(); });

  function shell(){
    backdrop.innerHTML = `
      <div class="idea-card">
        <div class="idea-head">
          <h3>💡 Ideas</h3>
          <button class="idea-close" id="ideaClose">&times;</button>
        </div>
        <div class="idea-tabs">
          <button class="idea-tab" data-mode="browse" data-active="${mode==='browse'}">Browse &amp; Vote</button>
          <button class="idea-tab" data-mode="submit" data-active="${mode==='submit'}">Submit an idea</button>
        </div>
        <div class="idea-body" id="ideaBody"></div>
      </div>`;
    backdrop.querySelector("#ideaClose").addEventListener("click", close);
    backdrop.querySelectorAll(".idea-tab").forEach(t=>{
      t.addEventListener("click", ()=>{ if(mode!==t.dataset.mode){ mode = t.dataset.mode; shell(); } });
    });
    if(mode==="browse") renderBrowse(); else renderSubmit();
  }

  function renderSubmit(){
    const body = backdrop.querySelector("#ideaBody");
    if(!dbApi){
      body.innerHTML = `<p class="idea-empty">The idea board only works on the published page (it needs the artifact's shared database), not in this local preview.</p>`;
      return;
    }
    body.innerHTML = `
      <textarea id="ideaText" maxlength="280" placeholder="What would make Icon Lab better? A new icon, a feature, a fix…"></textarea>
      <div class="idea-charcount"><span id="ideaCharCount">0</span>/280</div>
      <button class="btn primary" id="ideaSubmit" style="width:100%">Submit idea</button>
      <p class="idea-note">Visible to everyone who opens this page — please keep it civil and on-topic.</p>`;
    const ta = body.querySelector("#ideaText");
    ta.addEventListener("input", ()=>{ body.querySelector("#ideaCharCount").textContent = ta.value.length; });
    body.querySelector("#ideaSubmit").addEventListener("click", async ()=>{
      const text = ta.value.trim();
      if(!text) return;
      const btn = body.querySelector("#ideaSubmit");
      btn.disabled = true; btn.textContent = "Submitting…";
      try{
        await dbApi.collection("ideas").add({ text: text.slice(0,280), votes: 0, createdAt: Date.now() });
        mode = "browse";
        shell();
        toast({locked:true, text:"Idea submitted — thank you!"});
      }catch(e){
        btn.disabled = false; btn.textContent = "Submit idea";
        toast({locked:true, text:"Couldn't submit right now — try again."});
      }
    });
  }

  function renderBrowse(){
    const body = backdrop.querySelector("#ideaBody");
    if(!dbApi){
      body.innerHTML = `<p class="idea-empty">The idea board only works on the published page (it needs the artifact's shared database), not in this local preview.</p>`;
      return;
    }
    body.innerHTML = `<div class="idea-list" id="ideaList"><p class="idea-empty">Loading…</p></div>`;
    if(ideasUnsub) ideasUnsub();
    ideasUnsub = dbApi.collection("ideas").orderBy("votes","desc").limit(50).onSnapshot(
      (snap)=>{
        const list = backdrop.querySelector("#ideaList");
        if(!list) return;
        if(snap.empty){ list.innerHTML = `<p class="idea-empty">No ideas yet — be the first!</p>`; return; }
        const voted = getVotedSet();
        list.innerHTML = snap.docs.map(doc=>{
          const d = doc.data() || {};
          const hasVoted = voted.has(doc.id);
          return `<div class="idea-item">
            <button class="idea-vote${hasVoted?' voted':''}" data-id="${doc.id}" data-voted="${hasVoted}" title="${hasVoted?'Remove your heart':'Give this a heart'}">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="${hasVoted?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 21s-6.7-4.34-9.3-8.2C1 10 1.5 6.5 4.4 5c2.3-1.2 4.9-.4 7.6 2.5 2.7-2.9 5.3-3.7 7.6-2.5 2.9 1.5 3.4 5 1.7 7.8C18.7 16.66 12 21 12 21Z"/></svg>
              ${Number(d.votes)||0}
            </button>
            <p class="idea-text">${escapeHtml(d.text||"")}</p>
          </div>`;
        }).join("");
        list.querySelectorAll(".idea-vote").forEach(btn=>{
          btn.addEventListener("click", ()=> toggleVote(btn.dataset.id, btn, btn.dataset.voted==="true"));
        });
      },
      ()=>{ const list = backdrop.querySelector("#ideaList"); if(list) list.innerHTML = `<p class="idea-empty">Couldn't load ideas right now.</p>`; }
    );
  }

  async function toggleVote(id, btn, currentlyVoted){
    btn.disabled = true;
    try{
      const ref = dbApi.doc("ideas/"+id);
      const snap = await ref.get();
      if(!snap.exists) return;
      const current = Number((snap.data()||{}).votes) || 0;
      if(currentlyVoted){
        await ref.update({ votes: Math.max(0, current-1) });
        await dbApi.doc("ideas/"+id+"/votes/"+getVoterKey()).delete();
        unmarkVoted(id);
      }else{
        await ref.update({ votes: current+1 });
        await dbApi.doc("ideas/"+id+"/votes/"+getVoterKey()).set({ votedAt: Date.now() });
        markVoted(id);
      }
    }finally{ btn.disabled = false; }
  }

  shell();
}

/* Artifacts run in a sandboxed frame where window.confirm()/alert() are
   typically blocked (silently resolves false, or throws) — so this uses
   the same in-page overlay pattern as the rest of the UI instead. */
function showConfirm({title, body, confirmLabel, onConfirm}){
  const backdrop = document.createElement("div");
  backdrop.className = "overlay-backdrop";
  backdrop.innerHTML = `<div class="ad-card">
    <h3>${title}</h3>
    <p>${body}</p>
    <div class="ad-actions">
      <button class="btn" id="confirmCancel">Cancel</button>
      <button class="btn primary" id="confirmOk">${confirmLabel}</button>
    </div>
  </div>`;
  document.body.appendChild(backdrop);
  function close(){ backdrop.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(ev){ if(ev.key==="Escape") close(); }
  document.addEventListener("keydown", onKey);
  backdrop.addEventListener("click",(ev)=>{ if(ev.target===backdrop) close(); });
  backdrop.querySelector("#confirmCancel").addEventListener("click", close);
  backdrop.querySelector("#confirmOk").addEventListener("click", ()=>{ close(); onConfirm(); });
}

function openAbout(){
  const backdrop = document.createElement("div");
  backdrop.className = "overlay-backdrop";
  backdrop.innerHTML = `<div class="ad-card" style="text-align:left">
    <h3 style="text-align:center">About Icon Lab</h3>
    <p style="text-align:center">Combine four elements to discover 190 of the world's most iconic people, places, and ideas.</p>
    <p><b>Disclaimer:</b> Icon Lab is independent fan-made entertainment created for parody, commentary, and educational purposes. It is not affiliated with, endorsed by, or sponsored by any person, estate, company, or organization referenced in this game. No photographs, logos, or trademarks are used — every icon is an original emoji-style illustration. Quotes are attributed to their original speakers for informational purposes.</p>
    <p><b>On inclusion:</b> People appear here solely for their historical or cultural achievement in their field. Inclusion is not an endorsement of any person's full life, actions, or views, and omission of any individual carries no comment either way.</p>
    <div class="ad-actions">
      <button class="btn primary" id="aboutOk" style="width:100%">Got it</button>
    </div>
  </div>`;
  document.body.appendChild(backdrop);
  function close(){ backdrop.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(ev){ if(ev.key==="Escape") close(); }
  document.addEventListener("keydown", onKey);
  backdrop.addEventListener("click",(ev)=>{ if(ev.target===backdrop) close(); });
  backdrop.querySelector("#aboutOk").addEventListener("click", close);
}
document.getElementById("aboutBtn").addEventListener("click", openAbout);

document.getElementById("resetBtn").addEventListener("click", ()=>{
  showConfirm({
    title: "Reset all progress?",
    body: "This clears every icon you've discovered. This can't be undone.",
    confirmLabel: "Reset",
    onConfirm: ()=>{
      discovered = new Set(BASE_IDS);
      persist();
      [...tokens.keys()].forEach(removeToken);
      renderLedger();
      toast({locked:true, text:"Progress reset."});
    }
  });
});

document.getElementById("shareBtn").addEventListener("click", async ()=>{
  const people = PERSONS.filter(p=>discovered.has(p.id)).length;
  const text = `I've forged ${people}/${PERSONS.length} icons on Icon Lab. Can you beat me?`;
  try{ await navigator.clipboard.writeText(text); toast({locked:true, text:"Copied your progress to clipboard!"}); }
  catch(e){ toast({locked:true, text:text}); }
});

document.getElementById("searchInput").addEventListener("input",(ev)=>{ searchTerm = ev.target.value; renderLedger(); });

/* =========================================================
   DEVICE-AWARE CONVENIENCE (mobile drag sheet + desktop shortcuts)
========================================================= */
const isTouch = matchMedia("(pointer:coarse)").matches || "ontouchstart" in window;
document.body.classList.toggle("touch", isTouch);
document.getElementById("ledgerMetaHint").textContent = isTouch ? "long-press for recipe" : "right-click for recipe";

if(!isTouch){
  document.addEventListener("keydown",(ev)=>{
    if(ev.key==="/" && document.activeElement!==document.getElementById("searchInput")){
      ev.preventDefault();
      document.getElementById("searchInput").focus();
    }
  });
}

(function initLedgerToggle(){
  let dragStartY = null, startHeight = 0, dragging = false;
  ledgerToggle.addEventListener("pointerdown",(ev)=>{
    dragStartY = ev.clientY;
    startHeight = ledgerEl.getBoundingClientRect().height;
    dragging = false;
  });
  ledgerToggle.addEventListener("pointermove",(ev)=>{
    if(dragStartY===null) return;
    const dy = ev.clientY - dragStartY;
    if(!dragging && Math.abs(dy) > 4){ dragging = true; ledgerEl.classList.add("dragging"); }
    if(!dragging) return;
    const isOpen = ledgerEl.classList.contains("open");
    const base = isOpen ? 0 : startHeight - 58;
    let offset = clamp(base + dy, 0, startHeight - 58);
    ledgerEl.style.transform = `translateY(${offset}px)`;
  });
  window.addEventListener("pointerup",()=>{
    if(dragStartY===null) return;
    const wasDragging = dragging;
    dragStartY = null; dragging = false;

    if(!wasDragging){
      ledgerEl.classList.remove("dragging");
      ledgerEl.style.transform = "";
      ledgerEl.classList.toggle("open");
      return;
    }
    const rect = ledgerEl.getBoundingClientRect();
    const shouldOpen = rect.top < window.innerHeight - rect.height*0.6;
    ledgerEl.classList.toggle("open", shouldOpen);
    ledgerEl.classList.remove("dragging");
    ledgerEl.style.transform = "";
  });
})();

/* =========================================================
   INIT
========================================================= */
buildTabs();
renderLedger();
updateEmptyState();


})();
</script>
